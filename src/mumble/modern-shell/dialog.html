<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="auto" class="dialog-host-page">
<head>
	<meta charset="utf-8">
	<!-- SECURITY: see index.html. Script execution and direct network egress are intentionally tight. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc:; script-src 'self' qrc:; style-src 'self' qrc: 'unsafe-inline'; img-src 'self' qrc: https: data: blob:; media-src 'self' qrc: https: data: blob:; font-src 'self' qrc: data:; frame-src https:; connect-src 'self' qrc:; object-src 'none'; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mumble Dialog</title>
	<link rel="stylesheet" href="./theme-tokens.css">
	<script src="./theme.js"></script>
	<link rel="stylesheet" href="./styles.css">
</head>
<body class="dialog-host">
	<div id="modern-dialog-layer" class="modern-dialog-layer hidden" aria-hidden="true">
		<div id="modern-dialog-backdrop" class="modern-dialog-backdrop"></div>
		<section id="modern-dialog" class="modern-dialog" role="dialog" aria-modal="true" aria-labelledby="modern-dialog-title" tabindex="-1">
			<header class="modern-dialog-header">
				<div class="modern-dialog-copy">
					<p id="modern-dialog-eyebrow" class="modern-dialog-eyebrow">Mumble</p>
					<h1 id="modern-dialog-title" class="modern-dialog-title">Dialog</h1>
					<p id="modern-dialog-subtitle" class="modern-dialog-subtitle"></p>
				</div>
				<button id="modern-dialog-close-button" class="icon-button modern-dialog-close-button" type="button" title="Close" aria-label="Close">
					<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8"></path><path d="M16 8l-8 8"></path></svg>
				</button>
			</header>
			<div id="modern-dialog-body" class="modern-dialog-body"></div>
			<footer id="modern-dialog-actions" class="modern-dialog-actions"></footer>
		</section>
	</div>

	<script src="./build-flags.js" defer></script>
	<script src="./dialog.js" defer></script>
</body>
</html>
