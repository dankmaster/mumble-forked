name: Promote Qualified Input Enhancement Build

on:
  workflow_dispatch:
    inputs:
      immutable_tag:
        description: Existing mumble-forked-build-<build>-<sha12> release tag
        required: true
        type: string
      channel:
        description: Channel pointer to update
        required: true
        type: choice
        options:
          - preview
          - stable
      announcement:
        description: Short user-facing promotion announcement
        required: true
        type: string
      policy_available:
        description: Make input enhancement available through this signed policy
        required: true
        default: true
        type: boolean
      force_original:
        description: Emergency brake that forces Original for this channel
        required: true
        default: false
        type: boolean
      recommended_profile:
        description: Profile recommended by the signed channel policy
        required: true
        default: Balanced
        type: choice
        options:
          - Original
          - Light
          - Balanced
          - Quality
          - Auto
      policy_validity_days:
        description: Signed policy validity in days (1-30)
        required: true
        default: 7
        type: number
      rollout_evidence_tag:
        description: Signed input-enhancement rollout evidence release (required for non-emergency stable/Auto promotion)
        required: false
        default: ''
        type: string
      rollout_audience:
        description: Private community gate or later public rollout gates
        required: true
        default: private-community
        type: choice
        options:
          - private-community
          - public

permissions:
  contents: read

concurrency:
  group: input-enhancement-promote-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: verify-${{ inputs.channel }}-candidate
    runs-on: windows-2022
    environment: release-${{ inputs.channel }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SIGNER_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
      IMMUTABLE_TAG: ${{ inputs.immutable_tag }}
      PROMOTION_CHANNEL: ${{ inputs.channel }}
      ROLLOUT_AUDIENCE: ${{ inputs.rollout_audience }}
      PROMOTION_ANNOUNCEMENT: ${{ inputs.announcement }}
      POLICY_AVAILABLE: ${{ inputs.policy_available }}
      POLICY_FORCE_ORIGINAL: ${{ inputs.force_original }}
      POLICY_RECOMMENDED_PROFILE: ${{ inputs.recommended_profile }}
      POLICY_VALIDITY_DAYS: ${{ inputs.policy_validity_days }}
      ROLLOUT_EVIDENCE_TAG: ${{ inputs.rollout_evidence_tag }}
      INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX }}
      INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX }}
      INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256: ${{ vars.INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256 }}
      BOOTSTRAP_RECOVERY_SET_URL: ${{ vars.INPUT_ENHANCEMENT_BOOTSTRAP_RECOVERY_SET_URL }}
      BOOTSTRAP_RECOVERY_SET_SHA256: ${{ vars.INPUT_ENHANCEMENT_BOOTSTRAP_RECOVERY_SET_SHA256 }}
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Require trusted workflow ref and signing identity
        shell: powershell
        env:
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            throw "Promotions must be dispatched from the protected master workflow ref."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_SUBJECT)) {
            throw "The protected release environment has no expected Artifact Signing subject."
          }
          if ($env:IMMUTABLE_TAG -notmatch '^mumble-forked-build-[1-9][0-9]*-[0-9a-f]{12}$') {
            throw "immutable_tag does not use the required immutable build format."
          }
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $publicKey = Assert-Ed25519PublicKeyHex -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $derivedKey = Get-Ed25519PublicKeyHexFromPrivateKey `
            -PrivateKeyBase64 $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64
          if ($derivedKey -cne $publicKey) {
            throw "Protected Ed25519 release private/public keys do not match."
          }
          $validityDays = [int]$env:POLICY_VALIDITY_DAYS
          if ($validityDays -lt 1 -or $validityDays -gt 30) {
            throw "policy_validity_days must be between 1 and 30."
          }
          $rolloutTagValid = $env:ROLLOUT_EVIDENCE_TAG -match '^mumble-forked-rollout-[A-Za-z0-9._-]{1,80}$'
          if (-not [string]::IsNullOrWhiteSpace($env:ROLLOUT_EVIDENCE_TAG) -and -not $rolloutTagValid) {
            throw 'rollout_evidence_tag has an invalid release-tag format.'
          }
          Assert-InputEnhancementPromotionPolicy `
            -Channel $env:PROMOTION_CHANNEL `
            -Available ([bool]::Parse($env:POLICY_AVAILABLE)) `
            -ForceOriginal ([bool]::Parse($env:POLICY_FORCE_ORIGINAL)) `
            -RecommendedProfile $env:POLICY_RECOMMENDED_PROFILE `
            -RolloutAudience $env:ROLLOUT_AUDIENCE `
            -RolloutEvidenceAvailable $rolloutTagValid | Out-Null

      - name: Download immutable release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\immutable-release | Out-Null
          gh release download $env:IMMUTABLE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir .\immutable-release
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download immutable release '$env:IMMUTABLE_TAG'."
          }

      - name: Download required signed rollout evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $decision = Assert-InputEnhancementPromotionPolicy `
            -Channel $env:PROMOTION_CHANNEL `
            -Available ([bool]::Parse($env:POLICY_AVAILABLE)) `
            -ForceOriginal ([bool]::Parse($env:POLICY_FORCE_ORIGINAL)) `
            -RecommendedProfile $env:POLICY_RECOMMENDED_PROFILE `
            -RolloutAudience $env:ROLLOUT_AUDIENCE `
            -RolloutEvidenceAvailable ($env:ROLLOUT_EVIDENCE_TAG -match '^mumble-forked-rollout-[A-Za-z0-9._-]{1,80}$')
          $required = [bool]$decision.rolloutRequired
          "ROLLOUT_EVIDENCE_REQUIRED=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if (-not $required) { return }
          New-Item -ItemType Directory -Force -Path .\rollout-evidence | Out-Null
          foreach ($name in @(
            'input-enhancement-rollout.json',
            'input-enhancement-rollout.json.sig',
            'input-enhancement-aggregate-export.json',
            'input-enhancement-aggregate-export.json.sig'
          )) {
            gh release download $env:ROLLOUT_EVIDENCE_TAG --repo $env:GITHUB_REPOSITORY `
              --pattern $name --dir .\rollout-evidence
            if ($LASTEXITCODE -ne 0) {
              throw "Rollout evidence release '$env:ROLLOUT_EVIDENCE_TAG' is missing '$name'."
            }
          }
          if ($env:POLICY_RECOMMENDED_PROFILE -ceq 'Auto') {
            foreach ($name in @('rnnoise-selection-decision.json', 'rnnoise-selection-decision.json.sig')) {
              gh release download $env:ROLLOUT_EVIDENCE_TAG --repo $env:GITHUB_REPOSITORY `
                --pattern $name --dir .\rollout-evidence
              if ($LASTEXITCODE -ne 0) {
                throw "Auto rollout evidence release '$env:ROLLOUT_EVIDENCE_TAG' is missing '$name'."
              }
            }
          }

      - name: Verify exact qualified artifact and signatures
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $qualificationPath = '.\immutable-release\qualification.json'
          $qualificationSignaturePath = '.\immutable-release\qualification.json.sig'
          if (-not (Test-Path -LiteralPath $qualificationPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $qualificationSignaturePath -PathType Leaf)) {
            throw "Immutable release has no signed qualification.json."
          }
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath $qualificationPath -SignaturePath $qualificationSignaturePath `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $qualification = Get-Content -LiteralPath $qualificationPath -Raw | ConvertFrom-Json
          $sourceSha = [string]$qualification.source.sha
          $artifactPath = Join-Path '.\immutable-release' ([string]$qualification.artifact.fileName)
          $installerPath = Join-Path '.\immutable-release' ([string]$qualification.installer.fileName)
          $updatePackagePath = Join-Path '.\immutable-release' ([string]$qualification.updatePackage.fileName)
          $required = @(
            $artifactPath,
            $installerPath,
            $updatePackagePath,
            '.\immutable-release\input-models.json',
            '.\immutable-release\input-models.json.sig',
            '.\immutable-release\input-recipes.json',
            '.\immutable-release\input-recipes.json.sig',
            '.\immutable-release\unsigned-input-models.json',
            '.\immutable-release\unsigned-input-recipes.json',
            '.\immutable-release\test-gates.json',
            '.\immutable-release\signing-results.json',
            '.\immutable-release\msi-payload-verification.json',
            '.\immutable-release\measured-quality-attestation.json',
            '.\immutable-release\quality-low-performance.json',
            '.\immutable-release\original-voice-low-performance.json',
            '.\immutable-release\quality-mainstream.json',
            '.\immutable-release\original-voice-mainstream.json',
            '.\immutable-release\release-smoke.json',
            '.\immutable-release\release-smoke.json.sig'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Immutable release is incomplete: $($missing -join ', ')."
          }

          $remoteTag = @(git ls-remote origin "refs/tags/$env:IMMUTABLE_TAG")
          if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -ne 1) {
            throw "Immutable tag could not be resolved as one lightweight Git tag."
          }
          $tagSha = ([string]$remoteTag[0] -split '\s+')[0].ToLowerInvariant()
          if ($tagSha -cne $sourceSha.ToLowerInvariant()) {
            throw "Immutable tag SHA '$tagSha' does not match qualification SHA '$sourceSha'."
          }

          .\scripts\windows\assert-input-enhancement-qualification.ps1 `
            -QualificationPath $qualificationPath `
            -ArtifactPath $artifactPath `
            -InstallerPath $installerPath `
            -MsiPayloadVerificationPath .\immutable-release\msi-payload-verification.json `
            -UpdatePackagePath $updatePackagePath `
            -ModelManifestPath .\immutable-release\input-models.json `
            -RecipeManifestPath .\immutable-release\input-recipes.json `
            -UnsignedModelManifestPath .\immutable-release\unsigned-input-models.json `
            -UnsignedRecipeManifestPath .\immutable-release\unsigned-input-recipes.json `
            -ModelManifestSignaturePath .\immutable-release\input-models.json.sig `
            -RecipeManifestSignaturePath .\immutable-release\input-recipes.json.sig `
            -ExpectedEd25519PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -TestGateResultsPath .\immutable-release\test-gates.json `
            -SigningResultsPath .\immutable-release\signing-results.json `
            -MeasuredEvidencePath .\immutable-release\measured-quality-attestation.json `
            -ExpectedSourceSha $tagSha `
            -ExpectedBuildId $env:IMMUTABLE_TAG `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT

          New-Item -ItemType Directory -Force -Path .\standalone-installer-verify | Out-Null
          Copy-Item -LiteralPath $installerPath -Destination .\standalone-installer-verify
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root .\standalone-installer-verify `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -OutputPath .\standalone-installer-signature-verification.json

          Expand-Archive -LiteralPath $artifactPath -DestinationPath .\immutable-expanded
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 `
            -StageRoot .\immutable-expanded\app
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot .\immutable-expanded\app `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root .\immutable-expanded `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -OutputPath .\promotion-signature-verification.json
          .\scripts\windows\assert-windows-update-package.ps1 `
            -PackagePath $updatePackagePath `
            -ExpectedCommit $tagSha `
            -ExpectedBuild ([int]$qualification.buildNumber) `
            -ExpectedVersion "1.7.$($qualification.buildNumber)" `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -ExpandedPayloadPath .\promotion-update-expanded
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 `
            -StageRoot .\promotion-update-expanded
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot .\promotion-update-expanded `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root .\promotion-update-expanded `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -OutputPath .\promotion-update-signature-verification.json
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath .\immutable-release\release-smoke.json `
            -SignaturePath .\immutable-release\release-smoke.json.sig `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $releaseSmoke = Get-Content .\immutable-release\release-smoke.json -Raw | ConvertFrom-Json
          .\scripts\windows\assert-input-enhancement-release-smoke.ps1 `
            -ReleaseSmokePath .\immutable-release\release-smoke.json `
            -QualificationPath $qualificationPath `
            -ModelManifestPath .\immutable-release\input-models.json `
            -RecipeManifestPath .\immutable-release\input-recipes.json `
            -ModelManifestSignaturePath .\immutable-release\input-models.json.sig `
            -RecipeManifestSignaturePath .\immutable-release\input-recipes.json.sig `
            -ArtifactPath $updatePackagePath `
            -ExpandedArtifactRoot .\promotion-update-expanded `
            -ExpectedSourceSha $tagSha `
            -ExpectedBuildId $env:IMMUTABLE_TAG `
            -ExpectedHarnessSha256 ([string]$releaseSmoke.provenance.harnessSha256) `
            -FixtureManifestPath .\immutable-release\release-smoke-fixture-manifest.json `
            -CaseSetPath .\immutable-release\release-smoke-case-set.json `
            -ExpectedFixtureManifestSha256 ([string]$releaseSmoke.provenance.fixtureManifestSha256) `
            -ExpectedCaseSetSha256 ([string]$releaseSmoke.provenance.caseSetSha256) `
            -ExpectedServerExecutableSha256 ([string]$releaseSmoke.provenance.serverExecutableSha256)
          if ([bool]::Parse($env:ROLLOUT_EVIDENCE_REQUIRED)) {
            $promotionDecision = Assert-InputEnhancementPromotionPolicy `
              -Channel $env:PROMOTION_CHANNEL `
              -Available ([bool]::Parse($env:POLICY_AVAILABLE)) `
              -ForceOriginal ([bool]::Parse($env:POLICY_FORCE_ORIGINAL)) `
              -RecommendedProfile $env:POLICY_RECOMMENDED_PROFILE `
              -RolloutAudience $env:ROLLOUT_AUDIENCE `
              -RolloutEvidenceAvailable $true
            $rolloutArguments = @{
              EvidencePath = '.\rollout-evidence\input-enhancement-rollout.json'
              SignaturePath = '.\rollout-evidence\input-enhancement-rollout.json.sig'
              PublicKeyHex = $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
              AggregateExportPath = '.\rollout-evidence\input-enhancement-aggregate-export.json'
              AggregateExportSignaturePath = '.\rollout-evidence\input-enhancement-aggregate-export.json.sig'
              AggregatePublicKeyHex = $env:INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX
              ExpectedQuerySha256 = $env:INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256
              TargetStage = [string]$promotionDecision.targetStage
              ExpectedBuildId = $env:IMMUTABLE_TAG
              ExpectedRecipeSetVersion = [string]$qualification.recipeManifest.catalogRevision
            }
            if ($env:POLICY_RECOMMENDED_PROFILE -ceq 'Auto') {
              $rolloutArguments.RnnoiseDecisionPath = '.\rollout-evidence\rnnoise-selection-decision.json'
              $rolloutArguments.RnnoiseDecisionSignaturePath = '.\rollout-evidence\rnnoise-selection-decision.json.sig'
            }
            .\scripts\windows\assert-input-enhancement-rollout-qualification.ps1 @rolloutArguments
          }

          if ($env:PROMOTION_CHANNEL -ceq 'stable') {
            git fetch origin master --no-tags
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch origin/master for stable ancestry validation." }
            git merge-base --is-ancestor $tagSha origin/master
            if ($LASTEXITCODE -ne 0) {
              throw "Stable promotion requires the qualified source to be contained in origin/master."
            }
          }
          "source_sha=$tagSha" >> $env:GITHUB_OUTPUT

      - name: Download and verify previous recovery target or protected bootstrap
        shell: powershell
        run: |
          $channelTag = "mumble-forked-$env:PROMOTION_CHANNEL"
          "PREVIOUS_POINTER_AVAILABLE=false" >> $env:GITHUB_ENV
          "BOOTSTRAP_RECOVERY_SET_AVAILABLE=false" >> $env:GITHUB_ENV

          function Get-VerifiedBootstrapRecoverySet {
            if ($env:BOOTSTRAP_RECOVERY_SET_URL -notmatch '^https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/download/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]json$' -or
                $env:BOOTSTRAP_RECOVERY_SET_SHA256 -notmatch '^[0-9a-f]{64}$') {
              throw "The protected environment has no valid hash-pinned v1-to-v2 recovery bootstrap asset."
            }
            New-Item -ItemType Directory -Force -Path .\bootstrap-recovery | Out-Null
            Invoke-WebRequest -Uri $env:BOOTSTRAP_RECOVERY_SET_URL `
              -OutFile .\bootstrap-recovery\recovery-set.json
            $actualHash = (Get-FileHash -LiteralPath .\bootstrap-recovery\recovery-set.json `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -cne $env:BOOTSTRAP_RECOVERY_SET_SHA256) {
              throw "Protected bootstrap recovery metadata SHA256 mismatch."
            }
            $bootstrap = Get-Content .\bootstrap-recovery\recovery-set.json -Raw | ConvertFrom-Json
            $rootFields = @($bootstrap.PSObject.Properties.Name | Sort-Object)
            if (@(Compare-Object @('recoveryInstallers','schemaVersion') $rootFields).Count -ne 0 -or
                [int]$bootstrap.schemaVersion -ne 1 -or @($bootstrap.recoveryInstallers).Count -ne 2) {
              throw "Protected bootstrap recovery metadata has an invalid schema."
            }
            $seenTags = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::Ordinal)
            foreach ($entry in @($bootstrap.recoveryInstallers)) {
              $entryFields = @($entry.PSObject.Properties.Name | Sort-Object)
              if (@(Compare-Object @('fileName','immutableTag','sha256','size') $entryFields).Count -ne 0 -or
                  [string]$entry.immutableTag -notmatch '^mumble-forked-build-[1-9][0-9]*-[0-9a-f]{12}$' -or
                  -not $seenTags.Add([string]$entry.immutableTag) -or
                  [string]$entry.fileName -notmatch '^mumble-forked-[A-Za-z0-9._-]+[.]msi$' -or
                  [string]$entry.sha256 -notmatch '^[0-9a-f]{64}$' -or [int64]$entry.size -le 0) {
                throw "Protected bootstrap recovery MSI metadata is invalid or duplicated."
              }
              $targetDirectory = Join-Path .\bootstrap-recovery ([string]$entry.immutableTag)
              New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
              gh release download ([string]$entry.immutableTag) --repo $env:GITHUB_REPOSITORY `
                --pattern ([string]$entry.fileName) --dir $targetDirectory
              if ($LASTEXITCODE -ne 0) {
                throw "Bootstrap recovery MSI '$($entry.fileName)' is unavailable from '$($entry.immutableTag)'."
              }
              $msi = Get-Item -LiteralPath (Join-Path $targetDirectory ([string]$entry.fileName))
              if ([int64]$msi.Length -ne [int64]$entry.size -or
                  (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    [string]$entry.sha256) {
                throw "Bootstrap recovery MSI '$($entry.fileName)' failed exact size/SHA256 verification."
              }
            }
            "BOOTSTRAP_RECOVERY_SET_AVAILABLE=true" >> $env:GITHUB_ENV
          }

          gh release view $channelTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Get-VerifiedBootstrapRecoverySet
            return
          }
          New-Item -ItemType Directory -Force -Path .\previous-channel | Out-Null
          gh release download $channelTag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern channel-pointer.json `
            --pattern channel-pointer.json.sig `
            --dir .\previous-channel
          if ($LASTEXITCODE -ne 0) {
            throw "Existing channel release has no verifiable channel-pointer.json."
          }
          $previousPointer = Get-Content .\previous-channel\channel-pointer.json -Raw | ConvertFrom-Json
          if ([int]$previousPointer.schemaVersion -eq 2) {
            .\scripts\windows\assert-input-enhancement-recovery-pointer.ps1 `
              -Channel $env:PROMOTION_CHANNEL `
              -Repository $env:GITHUB_REPOSITORY `
              -PointerPath .\previous-channel\channel-pointer.json `
              -PointerSignaturePath .\previous-channel\channel-pointer.json.sig `
              -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
              -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
              -OutputRoot .\previous-recovery-verify
          } elseif ([int]$previousPointer.schemaVersion -eq 1) {
            .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
              -InputPath .\previous-channel\channel-pointer.json `
              -SignaturePath .\previous-channel\channel-pointer.json.sig `
              -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
            Get-VerifiedBootstrapRecoverySet
          } else {
            throw "Existing channel pointer has an unsupported schema."
          }
          "PREVIOUS_POINTER_AVAILABLE=true" >> $env:GITHUB_ENV

      - name: Create channel pointer and two-build recovery set
        shell: powershell
        env:
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          $previousPointer = ''
          if ([bool]::Parse($env:PREVIOUS_POINTER_AVAILABLE)) {
            $previousPointer = '.\previous-channel\channel-pointer.json'
            $previousPointerSignature = '.\previous-channel\channel-pointer.json.sig'
          }

          New-Item -ItemType Directory -Force -Path .\promotion-handoff | Out-Null
          $qualification = Get-Content .\immutable-release\qualification.json -Raw | ConvertFrom-Json
          $recipes = Get-Content .\immutable-release\input-recipes.json -Raw | ConvertFrom-Json
          $now = [DateTimeOffset]::UtcNow
          $expiration = [DateTimeOffset]::new(
            $now.Year, $now.Month, $now.Day, $now.Hour, $now.Minute, $now.Second, [TimeSpan]::Zero
          ).AddDays([int]$env:POLICY_VALIDITY_DAYS)
          .\scripts\windows\new-signed-input-enhancement-policy.ps1 `
            -Available ([bool]::Parse($env:POLICY_AVAILABLE)) `
            -ForceOriginal ([bool]::Parse($env:POLICY_FORCE_ORIGINAL)) `
            -RecommendedProfile $env:POLICY_RECOMMENDED_PROFILE `
            -RecipeSetVersion ([string]$recipes.catalogRevision) `
            -MinBuild ([uint64]$qualification.buildNumber) `
            -ExpiresAtUtc $expiration `
            -PrivateKeyBase64 $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 `
            -ExpectedPublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -OutputPath .\promotion-handoff\input-enhancement-policy.json

          $arguments = @{
            Channel = $env:PROMOTION_CHANNEL
            Repository = $env:GITHUB_REPOSITORY
            QualificationPath = '.\immutable-release\qualification.json'
            ReleaseSmokePath = '.\immutable-release\release-smoke.json'
            Announcement = $env:PROMOTION_ANNOUNCEMENT
            OutputPath = '.\promotion-handoff\channel-pointer.json'
            PrivateKeyBase64 = $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64
            ExpectedPublicKeyHex = $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
            PolicyPath = '.\promotion-handoff\input-enhancement-policy.json'
            PolicySignaturePath = '.\promotion-handoff\input-enhancement-policy.json.sig'
          }
          if (-not [string]::IsNullOrWhiteSpace($previousPointer)) {
            $arguments.PreviousPointerPath = $previousPointer
            $arguments.PreviousPointerSignaturePath = $previousPointerSignature
          }
          if ([bool]::Parse($env:BOOTSTRAP_RECOVERY_SET_AVAILABLE)) {
            $arguments.BootstrapRecoverySetPath = '.\bootstrap-recovery\recovery-set.json'
          }
          .\scripts\windows\new-input-enhancement-channel-pointer.ps1 @arguments

          $pointer = Get-Content .\promotion-handoff\channel-pointer.json -Raw | ConvertFrom-Json
          foreach ($knownGoodTag in @($pointer.knownGoodTags)) {
            gh release view $knownGoodTag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Known-good recovery release '$knownGoodTag' no longer exists."
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($previousPointer)) {
            Copy-Item -LiteralPath $previousPointer -Destination .\promotion-handoff\previous-channel-pointer.json
            Copy-Item -LiteralPath $previousPointerSignature `
              -Destination .\promotion-handoff\previous-channel-pointer.json.sig
          }
          if ([bool]::Parse($env:ROLLOUT_EVIDENCE_REQUIRED)) {
            $rolloutNames = @(
              'input-enhancement-rollout.json',
              'input-enhancement-rollout.json.sig',
              'input-enhancement-aggregate-export.json',
              'input-enhancement-aggregate-export.json.sig'
            )
            if ($env:POLICY_RECOMMENDED_PROFILE -ceq 'Auto') {
              $rolloutNames += @('rnnoise-selection-decision.json', 'rnnoise-selection-decision.json.sig')
            }
            foreach ($name in $rolloutNames) {
              Copy-Item -LiteralPath (Join-Path .\rollout-evidence $name) `
                -Destination (Join-Path .\promotion-handoff $name)
            }
          }

      - name: Transfer verified signed channel artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: input-enhancement-promotion-${{ inputs.channel }}-${{ inputs.immutable_tag }}
          if-no-files-found: error
          retention-days: 1
          path: promotion-handoff/*

  publish-channel-pointer:
    name: publish-${{ inputs.channel }}-pointer
    needs: verify-candidate
    runs-on: windows-2022
    environment: release-${{ inputs.channel }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMMUTABLE_TAG: ${{ inputs.immutable_tag }}
      PROMOTION_CHANNEL: ${{ inputs.channel }}
      ROLLOUT_AUDIENCE: ${{ inputs.rollout_audience }}
      INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX }}
      INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX }}
      INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256: ${{ vars.INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256 }}
      EXPECTED_SIGNER_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: input-enhancement-promotion-${{ inputs.channel }}-${{ inputs.immutable_tag }}
          path: promotion-handoff

      - name: Publish only the verified signed channel artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $pointerPath = '.\promotion-handoff\channel-pointer.json'
          $pointerSignaturePath = '.\promotion-handoff\channel-pointer.json.sig'
          $policyPath = '.\promotion-handoff\input-enhancement-policy.json'
          $policySignaturePath = '.\promotion-handoff\input-enhancement-policy.json.sig'
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath $pointerPath -SignaturePath $pointerSignaturePath `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath $policyPath -SignaturePath $policySignaturePath `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $policy = Assert-CanonicalInputEnhancementPolicy -Path $policyPath -RequireCurrentlyValid
          $pointer = Get-Content -LiteralPath $pointerPath -Raw | ConvertFrom-Json
          if ([int]$pointer.schemaVersion -ne 2 -or
              [string]$pointer.channel -cne $env:PROMOTION_CHANNEL -or
              [string]$pointer.immutableTag -cne $env:IMMUTABLE_TAG -or
              [string]$pointer.sourceSha -cne '${{ needs.verify-candidate.outputs.source_sha }}' -or
              [string]$pointer.detachedSignature.publicKeyHex -cne $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX.ToLowerInvariant()) {
            throw "Promotion handoff does not match the verified signed candidate."
          }
          $policyRecord = $pointer.inputEnhancementPolicy
          if ([string]$policyRecord.fileName -cne (Split-Path -Leaf $policyPath) -or
              [string]$policyRecord.signatureFileName -cne (Split-Path -Leaf $policySignaturePath) -or
              [string]$policyRecord.sha256 -cne (Get-FileHash $policyPath -Algorithm SHA256).Hash.ToLowerInvariant() -or
              [string]$policyRecord.signatureSha256 -cne (Get-FileHash $policySignaturePath -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw "Signed channel pointer does not attest the transferred policy bytes and signature."
          }
          $rolloutPath = '.\promotion-handoff\input-enhancement-rollout.json'
          $rolloutSignaturePath = '.\promotion-handoff\input-enhancement-rollout.json.sig'
          $aggregatePath = '.\promotion-handoff\input-enhancement-aggregate-export.json'
          $aggregateSignaturePath = '.\promotion-handoff\input-enhancement-aggregate-export.json.sig'
          $rolloutEvidencePaths = @($rolloutPath, $rolloutSignaturePath, $aggregatePath, $aggregateSignaturePath)
          $rolloutEvidencePresence = @($rolloutEvidencePaths | Where-Object {
            Test-Path -LiteralPath $_ -PathType Leaf
          }).Count
          if ($rolloutEvidencePresence -notin @(0, $rolloutEvidencePaths.Count)) {
            throw 'Promotion handoff contains an incomplete rollout/aggregate evidence quartet.'
          }
          $hasCompleteRolloutEvidence = $rolloutEvidencePresence -eq $rolloutEvidencePaths.Count
          $rnnoiseDecisionPath = '.\promotion-handoff\rnnoise-selection-decision.json'
          $rnnoiseDecisionSignaturePath = '.\promotion-handoff\rnnoise-selection-decision.json.sig'
          $rnnoiseEvidencePaths = @($rnnoiseDecisionPath, $rnnoiseDecisionSignaturePath)
          $rnnoiseEvidencePresence = @($rnnoiseEvidencePaths | Where-Object {
            Test-Path -LiteralPath $_ -PathType Leaf
          }).Count
          if ($rnnoiseEvidencePresence -notin @(0, $rnnoiseEvidencePaths.Count)) {
            throw 'Promotion handoff contains incomplete RNNoise selection-decision evidence.'
          }
          if ([string]$policy.recommendedProfile -ceq 'Auto' -and
              $rnnoiseEvidencePresence -ne $rnnoiseEvidencePaths.Count) {
            throw 'Auto promotion requires the complete signed RNNoise selection decision.'
          }
          $promotionDecision = Assert-InputEnhancementPromotionPolicy `
            -Channel $env:PROMOTION_CHANNEL `
            -Available ([bool]$policy.available) `
            -ForceOriginal ([bool]$policy.forceOriginal) `
            -RecommendedProfile ([string]$policy.recommendedProfile) `
            -RolloutAudience $env:ROLLOUT_AUDIENCE `
            -RolloutEvidenceAvailable $hasCompleteRolloutEvidence
          $rolloutRequired = [bool]$promotionDecision.rolloutRequired
          if ($rolloutRequired) {
            $rolloutArguments = @{
              EvidencePath = $rolloutPath
              SignaturePath = $rolloutSignaturePath
              PublicKeyHex = $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
              AggregateExportPath = $aggregatePath
              AggregateExportSignaturePath = $aggregateSignaturePath
              AggregatePublicKeyHex = $env:INPUT_ENHANCEMENT_TELEMETRY_AGGREGATE_PUBLIC_KEY_HEX
              ExpectedQuerySha256 = $env:INPUT_ENHANCEMENT_ROLLOUT_QUERY_SHA256
              TargetStage = [string]$promotionDecision.targetStage
              ExpectedBuildId = [string]$pointer.immutableTag
              ExpectedRecipeSetVersion = [string]$policy.recipeSetVersion
            }
            if ($rnnoiseEvidencePresence -eq $rnnoiseEvidencePaths.Count) {
              $rolloutArguments.RnnoiseDecisionPath = $rnnoiseDecisionPath
              $rolloutArguments.RnnoiseDecisionSignaturePath = $rnnoiseDecisionSignaturePath
            }
            .\scripts\windows\assert-input-enhancement-rollout-qualification.ps1 @rolloutArguments
          }

          # Revalidate the complete schema-v2 candidate plus both recovery MSIs
          # in the publishing job. This also covers the one-time v1 bootstrap,
          # whose protected inputs have already been folded into the signed v2
          # pointer by the verification job.
          .\scripts\windows\assert-input-enhancement-recovery-pointer.ps1 `
            -Channel $env:PROMOTION_CHANNEL -Repository $env:GITHUB_REPOSITORY `
            -PointerPath $pointerPath -PointerSignaturePath $pointerSignaturePath `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
            -OutputRoot .\publisher-current-recovery-verify

          $previousPointerPath = '.\promotion-handoff\previous-channel-pointer.json'
          $previousPointerSignaturePath = '.\promotion-handoff\previous-channel-pointer.json.sig'
          if ((Test-Path -LiteralPath $previousPointerPath) -xor
              (Test-Path -LiteralPath $previousPointerSignaturePath)) {
            throw 'Promotion handoff contains an incomplete previous channel pointer pair.'
          }
          if (Test-Path -LiteralPath $previousPointerPath) {
            $previousPointerForPublication = Get-Content -LiteralPath $previousPointerPath -Raw | ConvertFrom-Json
            if ([int]$previousPointerForPublication.schemaVersion -eq 2) {
              .\scripts\windows\assert-input-enhancement-recovery-pointer.ps1 `
                -Channel $env:PROMOTION_CHANNEL -Repository $env:GITHUB_REPOSITORY `
                -PointerPath $previousPointerPath -PointerSignaturePath $previousPointerSignaturePath `
                -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
                -ExpectedSignerSubject $env:EXPECTED_SIGNER_SUBJECT `
                -OutputRoot .\publisher-previous-recovery-verify
            } elseif ([int]$previousPointerForPublication.schemaVersion -eq 1) {
              .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
                -InputPath $previousPointerPath -SignaturePath $previousPointerSignaturePath `
                -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
              if ([string]$previousPointerForPublication.channel -cne $env:PROMOTION_CHANNEL) {
                throw 'Previous schema-v1 channel pointer belongs to another channel.'
              }
            } else {
              throw 'Previous channel pointer has an unsupported schema.'
            }
          } elseif (@($pointer.knownGoodTags).Count -ne 3) {
            throw 'A schema-v2 channel pointer requires the candidate plus two verified recovery builds.'
          }

          New-Item -ItemType Directory -Force -Path .\publish-reverify | Out-Null
          gh release download ([string]$pointer.immutableTag) `
            --repo $env:GITHUB_REPOSITORY `
            --pattern qualification.json `
            --pattern qualification.json.sig `
            --pattern release-smoke.json `
            --pattern release-smoke.json.sig `
            --pattern ([string]$pointer.artifact.fileName) `
            --dir .\publish-reverify
          if ($LASTEXITCODE -ne 0) {
            throw "Immutable release assets disappeared before pointer publication."
          }
          $downloadedQualificationHash = (Get-FileHash .\publish-reverify\qualification.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadedArtifactHash = (Get-FileHash `
            (Join-Path '.\publish-reverify' ([string]$pointer.artifact.fileName)) `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedQualificationHash -cne [string]$pointer.qualification.sha256 -or
              $downloadedArtifactHash -cne [string]$pointer.artifact.sha256) {
            throw "Immutable release assets changed after verification; promotion is aborted."
          }
          $downloadedSmokeHash = (Get-FileHash .\publish-reverify\release-smoke.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedSmokeHash -cne [string]$pointer.releaseSmoke.sha256) {
            throw "Immutable release-smoke evidence changed after verification; promotion is aborted."
          }
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath .\publish-reverify\qualification.json `
            -SignaturePath .\publish-reverify\qualification.json.sig `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath .\publish-reverify\release-smoke.json `
            -SignaturePath .\publish-reverify\release-smoke.json.sig `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $immutableRemoteTag = @(git ls-remote origin "refs/tags/$($pointer.immutableTag)")
          if ($LASTEXITCODE -ne 0 -or $immutableRemoteTag.Count -ne 1 -or
              (([string]$immutableRemoteTag[0] -split '\s+')[0].ToLowerInvariant()) -cne [string]$pointer.sourceSha) {
            throw "Immutable source tag changed after verification; promotion is aborted."
          }

          $channelTag = [string]$pointer.channelTag
          $sourceSha = [string]$pointer.sourceSha
          $notes = @(
            "# Input enhancement $($pointer.channel)",
            "",
            [string]$pointer.announcement,
            "",
            "- Immutable build: $($pointer.immutableTag)",
            "- Source: $($pointer.sourceSha)",
            "- Authenticode and detached Ed25519 signatures reverified: yes",
            "- Known-good recovery builds: $($pointer.knownGoodTags -join ', ')"
          )
          [System.IO.File]::WriteAllLines('.\channel-release-notes.md', $notes, [System.Text.UTF8Encoding]::new($false))
          gh release view $channelTag --repo $env:GITHUB_REPOSITORY *> $null
          $modernReleaseExisted = $LASTEXITCODE -eq 0
          $isPreview = $env:PROMOTION_CHANNEL -ceq 'preview'
          $channelPrerequisiteAssets = @($pointerSignaturePath, $policyPath, $policySignaturePath)
          if ($rolloutRequired) {
            $channelPrerequisiteAssets += @(
              $rolloutPath, $rolloutSignaturePath, $aggregatePath, $aggregateSignaturePath
            )
            if ($rnnoiseEvidencePresence -eq $rnnoiseEvidencePaths.Count) {
              $channelPrerequisiteAssets += $rnnoiseEvidencePaths
            }
          }
          $managedChannelAssetNames = @(
            'channel-pointer.json.sig',
            'input-enhancement-policy.json',
            'input-enhancement-policy.json.sig',
            'input-enhancement-rollout.json',
            'input-enhancement-rollout.json.sig',
            'input-enhancement-aggregate-export.json',
            'input-enhancement-aggregate-export.json.sig',
            'rnnoise-selection-decision.json',
            'rnnoise-selection-decision.json.sig',
            'channel-pointer.json'
          )
          $previousChannelTag = @(git ls-remote origin "refs/tags/$channelTag")
          if ($LASTEXITCODE -ne 0 -or $previousChannelTag.Count -gt 1) {
            throw 'Unable to snapshot the existing modern channel tag.'
          }
          $previousChannelSha = if ($previousChannelTag.Count -eq 1) {
            (([string]$previousChannelTag[0] -split '\s+')[0]).ToLowerInvariant()
          } else { '' }
          if ($modernReleaseExisted -and [string]::IsNullOrWhiteSpace($previousChannelSha)) {
            throw 'Existing modern channel release has no restorable remote tag.'
          }
          $modernRollbackRoot = '.\modern-channel-rollback'
          New-Item -ItemType Directory -Force -Path $modernRollbackRoot | Out-Null
          if ($modernReleaseExisted) {
            $existingModernRelease = gh release view $channelTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to snapshot existing modern channel assets.' }
            foreach ($asset in @($existingModernRelease.assets)) {
              $name = [string]$asset.name
              if ($name -cin $managedChannelAssetNames) {
                gh release download $channelTag --repo $env:GITHUB_REPOSITORY `
                  --pattern $name --dir $modernRollbackRoot
                if ($LASTEXITCODE -ne 0) { throw "Unable to snapshot modern channel asset '$name'." }
              }
            }
          }

          $restoreModernChannel = {
            if (-not $modernReleaseExisted) {
              gh release view $channelTag --repo $env:GITHUB_REPOSITORY *> $null
              if ($LASTEXITCODE -eq 0) {
                gh release delete $channelTag --repo $env:GITHUB_REPOSITORY --yes
                if ($LASTEXITCODE -ne 0) { throw 'Unable to delete the partially created modern channel release.' }
              }
            } else {
              $currentModernRelease = gh release view $channelTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect modern channel assets during rollback.' }
              foreach ($name in $managedChannelAssetNames) {
                $rollbackPath = Join-Path $modernRollbackRoot $name
                $currentMatches = @($currentModernRelease.assets | Where-Object { [string]$_.name -ceq $name })
                if (Test-Path -LiteralPath $rollbackPath -PathType Leaf) {
                  gh release upload $channelTag $rollbackPath --repo $env:GITHUB_REPOSITORY --clobber
                  if ($LASTEXITCODE -ne 0) { throw "Unable to restore modern channel asset '$name'." }
                } elseif ($currentMatches.Count -eq 1) {
                  gh release delete-asset $channelTag $name --repo $env:GITHUB_REPOSITORY --yes
                  if ($LASTEXITCODE -ne 0) { throw "Unable to remove new modern channel asset '$name'." }
                }
              }
            }
            if (-not [string]::IsNullOrWhiteSpace($previousChannelSha)) {
              git tag -f $channelTag $previousChannelSha
              if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the local modern channel tag.' }
              git push origin "refs/tags/$channelTag" --force
              if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the remote modern channel tag.' }
            } else {
              git push origin ":refs/tags/$channelTag"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to remove the newly created modern channel tag.' }
            }
            $restoredChannelTag = @(git ls-remote origin "refs/tags/$channelTag")
            $expectedRestoredChannelCount = if ([string]::IsNullOrWhiteSpace($previousChannelSha)) { 0 } else { 1 }
            if ($LASTEXITCODE -ne 0 -or $restoredChannelTag.Count -ne $expectedRestoredChannelCount -or
                ($expectedRestoredChannelCount -eq 1 -and
                  (([string]$restoredChannelTag[0] -split '\s+')[0]).ToLowerInvariant() -cne $previousChannelSha)) {
              throw 'Modern channel tag rollback could not be verified.'
            }
            if ($modernReleaseExisted) {
              $restoredModernRelease = gh release view $channelTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Unable to verify restored modern channel assets.' }
              $modernRollbackVerifyRoot = '.\modern-channel-rollback-verify'
              New-Item -ItemType Directory -Force -Path $modernRollbackVerifyRoot | Out-Null
              foreach ($name in $managedChannelAssetNames) {
                $rollbackPath = Join-Path $modernRollbackRoot $name
                $restoredMatches = @($restoredModernRelease.assets | Where-Object { [string]$_.name -ceq $name })
                $shouldExist = Test-Path -LiteralPath $rollbackPath -PathType Leaf
                if ($restoredMatches.Count -ne $(if ($shouldExist) { 1 } else { 0 })) {
                  throw "Modern channel rollback asset-set mismatch for '$name'."
                }
                if ($shouldExist) {
                  gh release download $channelTag --repo $env:GITHUB_REPOSITORY `
                    --pattern $name --dir $modernRollbackVerifyRoot
                  if ($LASTEXITCODE -ne 0 -or
                      (Get-FileHash (Join-Path $modernRollbackVerifyRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                        (Get-FileHash $rollbackPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
                    throw "Modern channel rollback bytes for '$name' could not be verified."
                  }
                }
              }
            }
          }

          $publishModernChannel = {
            try {
              if (-not $modernReleaseExisted) {
                git tag -f $channelTag $sourceSha
                if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the modern channel tag.' }
                git push origin "refs/tags/$channelTag" --force
                if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the remote modern channel tag.' }
                $arguments = @(
                  'release', 'create', $channelTag
                ) + $channelPrerequisiteAssets + @(
                  '--repo', $env:GITHUB_REPOSITORY,
                  '--verify-tag',
                  '--title', "mumble-forked $($pointer.channel)",
                  '--notes-file', '.\channel-release-notes.md'
                )
                if ($isPreview) { $arguments += '--prerelease' }
                & gh @arguments
                if ($LASTEXITCODE -ne 0) { throw 'Unable to create the modern channel release prerequisites.' }
              } else {
                gh release upload $channelTag @channelPrerequisiteAssets `
                  --repo $env:GITHUB_REPOSITORY --clobber
                if ($LASTEXITCODE -ne 0) { throw 'Unable to publish modern channel prerequisite assets.' }
              }

              $channelPrerequisiteVerifyRoot = '.\modern-prerequisite-reverify'
              New-Item -ItemType Directory -Force -Path $channelPrerequisiteVerifyRoot | Out-Null
              foreach ($assetPath in $channelPrerequisiteAssets) {
                $name = Split-Path -Leaf $assetPath
                gh release download $channelTag --repo $env:GITHUB_REPOSITORY `
                  --pattern $name --dir $channelPrerequisiteVerifyRoot
                if ($LASTEXITCODE -ne 0 -or
                    (Get-FileHash (Join-Path $channelPrerequisiteVerifyRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                      (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
                  throw "Modern channel prerequisite '$name' failed remote byte verification."
                }
              }
              .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
                -InputPath (Join-Path $channelPrerequisiteVerifyRoot 'input-enhancement-policy.json') `
                -SignaturePath (Join-Path $channelPrerequisiteVerifyRoot 'input-enhancement-policy.json.sig') `
                -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX

              # channel-pointer.json is the modern channel commit point. Its
              # signature and every referenced prerequisite are durable first.
              gh release upload $channelTag $pointerPath --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the modern signed channel pointer last.' }
              $channelPointerVerifyRoot = '.\modern-pointer-reverify'
              New-Item -ItemType Directory -Force -Path $channelPointerVerifyRoot | Out-Null
              gh release download $channelTag --repo $env:GITHUB_REPOSITORY `
                --pattern channel-pointer.json --dir $channelPointerVerifyRoot
              if ($LASTEXITCODE -ne 0 -or
                  (Get-FileHash (Join-Path $channelPointerVerifyRoot 'channel-pointer.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    (Get-FileHash $pointerPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
                throw 'Modern channel pointer failed remote byte verification.'
              }
              .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
                -InputPath (Join-Path $channelPointerVerifyRoot 'channel-pointer.json') `
                -SignaturePath (Join-Path $channelPrerequisiteVerifyRoot 'channel-pointer.json.sig') `
                -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX

              git tag -f $channelTag $sourceSha
              if ($LASTEXITCODE -ne 0) { throw 'Unable to update the local modern channel tag.' }
              git push origin "refs/tags/$channelTag" --force
              if ($LASTEXITCODE -ne 0) { throw 'Unable to update the remote modern channel tag.' }
              gh release edit $channelTag `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --target $sourceSha `
                --title "mumble-forked $($pointer.channel)" `
                --notes-file .\channel-release-notes.md `
                --prerelease=$($isPreview.ToString().ToLowerInvariant())
              if ($LASTEXITCODE -ne 0) { throw 'Unable to finalize the modern channel release metadata.' }
            } catch {
              $modernFailure = $_
              & $restoreModernChannel
              throw $modernFailure
            }
          }

          if ($env:PROMOTION_CHANNEL -ceq 'preview') {
            & $publishModernChannel
          }

          # Existing installed builds still request the legacy stable manifest.
          # Publish a compatibility pointer to the same immutable, signed MSI
          # and update package; never rebuild, duplicate, or delete history.
          if ($env:PROMOTION_CHANNEL -ceq 'stable') {
            $immutableQualification = Get-Content .\publish-reverify\qualification.json -Raw | ConvertFrom-Json
            $installerName = [string]$immutableQualification.installer.fileName
            gh release download ([string]$pointer.immutableTag) `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $installerName `
              --dir .\publish-reverify
            if ($LASTEXITCODE -ne 0) { throw 'Signed compatibility installer is missing.' }
            $installerPath = Join-Path '.\publish-reverify' $installerName
            if ((Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                [string]$immutableQualification.installer.sha256) {
              throw 'Signed compatibility installer changed after qualification.'
            }
            $version = "1.7.$($pointer.buildNumber)"
            $immutableBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$($pointer.immutableTag)"
            $legacyManifest = [ordered]@{
              manifestVersion = 2
              name = 'mumble-forked'
              version = $version
              build = [int]$pointer.buildNumber
              commit = [string]$pointer.sourceSha
              branch = 'master'
              announcement = [string]$pointer.announcement
              releaseNotes = "Qualified immutable build $($pointer.immutableTag)"
              changelog = "Promoted from the signed immutable qualification $($pointer.immutableTag)."
              releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$($pointer.immutableTag)"
              installerUrl = "$immutableBase/$installerName"
              sha256 = [string]$immutableQualification.installer.sha256
              installer = [ordered]@{
                format = 'msi'
                url = "$immutableBase/$installerName"
                sha256 = [string]$immutableQualification.installer.sha256
                size = [int64]$immutableQualification.installer.size
              }
              package = [ordered]@{
                format = 'mumble-update-v1'
                url = [string]$pointer.artifact.url
                sha256 = [string]$pointer.artifact.sha256
                size = [int64]$pointer.artifact.size
                minUpdaterVersion = 3
                applyMode = 'replace-staged-payload'
              }
              preferredUpdate = 'package'
              publishedAt = [string]$pointer.promotedAtUtc
            }
            [System.IO.File]::WriteAllText(
              '.\mumble-forked-update.json',
              ($legacyManifest | ConvertTo-Json -Depth 10),
              [System.Text.UTF8Encoding]::new($false)
            )
            $legacyTag = 'mumble-forked'
            $previousLegacyTag = @(git ls-remote origin "refs/tags/$legacyTag")
            if ($LASTEXITCODE -ne 0 -or $previousLegacyTag.Count -gt 1) {
              throw 'Unable to snapshot the stable compatibility tag.'
            }
            $previousLegacySha = if ($previousLegacyTag.Count -eq 1) {
              (([string]$previousLegacyTag[0] -split '\s+')[0]).ToLowerInvariant()
            } else { '' }
            gh release view $legacyTag --repo $env:GITHUB_REPOSITORY *> $null
            $legacyReleaseExisted = $LASTEXITCODE -eq 0
            if ($legacyReleaseExisted -and [string]::IsNullOrWhiteSpace($previousLegacySha)) {
              throw 'Existing compatibility release has no restorable remote tag.'
            }
            $compatibilityRollbackRoot = '.\compatibility-rollback'
            New-Item -ItemType Directory -Force -Path $compatibilityRollbackRoot | Out-Null
            if ($legacyReleaseExisted) {
              $legacySnapshot = gh release view $legacyTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Unable to snapshot stable compatibility assets.' }
              $previousManifestMatches = @($legacySnapshot.assets | Where-Object {
                [string]$_.name -ceq 'mumble-forked-update.json'
              })
              if ($previousManifestMatches.Count -gt 1) {
                throw 'Stable compatibility release contains duplicate mutable manifests.'
              }
              if ($previousManifestMatches.Count -eq 1) {
                gh release download $legacyTag --repo $env:GITHUB_REPOSITORY `
                  --pattern mumble-forked-update.json --dir $compatibilityRollbackRoot
                if ($LASTEXITCODE -ne 0) { throw 'Unable to snapshot the previous compatibility manifest.' }
              }
            }
            $restoreCompatibility = {
              if (-not $legacyReleaseExisted) {
                gh release view $legacyTag --repo $env:GITHUB_REPOSITORY *> $null
                if ($LASTEXITCODE -eq 0) {
                  gh release delete $legacyTag --repo $env:GITHUB_REPOSITORY --yes
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to delete the partially created compatibility release.' }
                }
              } else {
                $previousManifestPath = Join-Path $compatibilityRollbackRoot 'mumble-forked-update.json'
                $currentLegacyRelease = gh release view $legacyTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect compatibility assets during rollback.' }
                $currentManifest = @($currentLegacyRelease.assets | Where-Object {
                  [string]$_.name -ceq 'mumble-forked-update.json'
                })
                if (Test-Path -LiteralPath $previousManifestPath -PathType Leaf) {
                  gh release upload $legacyTag $previousManifestPath --repo $env:GITHUB_REPOSITORY --clobber
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the previous compatibility manifest.' }
                } elseif ($currentManifest.Count -eq 1) {
                  gh release delete-asset $legacyTag mumble-forked-update.json `
                    --repo $env:GITHUB_REPOSITORY --yes
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to remove the new compatibility manifest.' }
                }
              }
              if (-not [string]::IsNullOrWhiteSpace($previousLegacySha)) {
                git tag -f $legacyTag $previousLegacySha
                if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the local compatibility tag.' }
                git push origin "refs/tags/$legacyTag" --force
                if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the remote compatibility tag.' }
              } else {
                git push origin ":refs/tags/$legacyTag"
                if ($LASTEXITCODE -ne 0) { throw 'Unable to remove the newly created compatibility tag.' }
              }
              $restoredLegacyTag = @(git ls-remote origin "refs/tags/$legacyTag")
              $expectedRestoredLegacyCount = if ([string]::IsNullOrWhiteSpace($previousLegacySha)) { 0 } else { 1 }
              if ($LASTEXITCODE -ne 0 -or $restoredLegacyTag.Count -ne $expectedRestoredLegacyCount -or
                  ($expectedRestoredLegacyCount -eq 1 -and
                    (([string]$restoredLegacyTag[0] -split '\s+')[0]).ToLowerInvariant() -cne $previousLegacySha)) {
                throw 'Compatibility tag rollback could not be verified.'
              }
              if ($legacyReleaseExisted) {
                $restoredLegacyRelease = gh release view $legacyTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { throw 'Unable to verify restored compatibility assets.' }
                $restoredManifest = @($restoredLegacyRelease.assets | Where-Object {
                  [string]$_.name -ceq 'mumble-forked-update.json'
                })
                $previousManifestPath = Join-Path $compatibilityRollbackRoot 'mumble-forked-update.json'
                $manifestShouldExist = Test-Path -LiteralPath $previousManifestPath -PathType Leaf
                if ($restoredManifest.Count -ne $(if ($manifestShouldExist) { 1 } else { 0 })) {
                  throw 'Compatibility manifest rollback asset-set could not be verified.'
                }
                if ($manifestShouldExist) {
                  $compatibilityRollbackVerifyRoot = '.\compatibility-rollback-verify'
                  New-Item -ItemType Directory -Force -Path $compatibilityRollbackVerifyRoot | Out-Null
                  gh release download $legacyTag --repo $env:GITHUB_REPOSITORY `
                    --pattern mumble-forked-update.json --dir $compatibilityRollbackVerifyRoot
                  if ($LASTEXITCODE -ne 0 -or
                      (Get-FileHash (Join-Path $compatibilityRollbackVerifyRoot 'mumble-forked-update.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                        (Get-FileHash $previousManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
                    throw 'Compatibility manifest rollback bytes could not be verified.'
                  }
                }
              }
            }

            try {
              if (-not $legacyReleaseExisted) {
                git tag -f $legacyTag $sourceSha
                if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the compatibility tag.' }
                git push origin "refs/tags/$legacyTag" --force
                if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the remote compatibility tag.' }
                gh release create $legacyTag --repo $env:GITHUB_REPOSITORY `
                  --verify-tag --title 'mumble-forked stable compatibility pointer' `
                  --notes 'This compatibility release points existing clients to the exact signed immutable qualification.'
                if ($LASTEXITCODE -ne 0) { throw 'Unable to create the stable compatibility release.' }
              }

              $updatePath = Join-Path '.\publish-reverify' ([string]$pointer.artifact.fileName)
              # Versioned binary names are immutable. Existing same-name assets
              # must already contain identical bytes; no prior build is deleted.
              $legacyRelease = gh release view $legacyTag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Unable to enumerate stable compatibility assets.' }
              $binaryAssets = @(
                [pscustomobject]@{
                  name = $installerName
                  path = $installerPath
                  sha256 = [string]$immutableQualification.installer.sha256
                },
                [pscustomobject]@{
                  name = [string]$pointer.artifact.fileName
                  path = $updatePath
                  sha256 = [string]$pointer.artifact.sha256
                }
              )
              $binaryUploads = @()
              New-Item -ItemType Directory -Force -Path .\compatibility-existing | Out-Null
              foreach ($binaryAsset in $binaryAssets) {
                $matches = @($legacyRelease.assets | Where-Object { [string]$_.name -ceq [string]$binaryAsset.name })
                if ($matches.Count -gt 1) {
                  throw "Stable compatibility release contains duplicate '$($binaryAsset.name)' assets."
                }
                if ($matches.Count -eq 1) {
                  gh release download $legacyTag --repo $env:GITHUB_REPOSITORY `
                    --pattern ([string]$binaryAsset.name) --dir .\compatibility-existing
                  $existingPath = Join-Path '.\compatibility-existing' ([string]$binaryAsset.name)
                  if ($LASTEXITCODE -ne 0 -or
                      (Get-FileHash $existingPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne [string]$binaryAsset.sha256) {
                    throw "Stable compatibility asset '$($binaryAsset.name)' collides with different bytes."
                  }
                } else {
                  $binaryUploads += [string]$binaryAsset.path
                }
              }
              if ($binaryUploads.Count -gt 0) {
                gh release upload $legacyTag @binaryUploads --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) { throw 'Unable to publish qualified stable compatibility binaries.' }
              }
              New-Item -ItemType Directory -Force -Path .\compatibility-reverify | Out-Null
              gh release download $legacyTag --repo $env:GITHUB_REPOSITORY `
                --pattern $installerName --pattern ([string]$pointer.artifact.fileName) `
                --dir .\compatibility-reverify
              if ($LASTEXITCODE -ne 0 -or
                  (Get-FileHash (Join-Path '.\compatibility-reverify' $installerName) -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    [string]$immutableQualification.installer.sha256 -or
                  (Get-FileHash (Join-Path '.\compatibility-reverify' ([string]$pointer.artifact.fileName)) -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    [string]$pointer.artifact.sha256) {
                throw 'Published stable compatibility binaries do not match the qualified immutable bytes.'
              }

              # Compatibility manifest advances only after both immutable
              # binary names have been downloaded and re-hashed successfully.
              gh release upload $legacyTag .\mumble-forked-update.json `
                --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the stable compatibility manifest.' }
              gh release download $legacyTag --repo $env:GITHUB_REPOSITORY `
                --pattern mumble-forked-update.json --dir .\compatibility-reverify
              if ($LASTEXITCODE -ne 0 -or
                  (Get-FileHash .\compatibility-reverify\mumble-forked-update.json -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    (Get-FileHash .\mumble-forked-update.json -Algorithm SHA256).Hash.ToLowerInvariant()) {
                throw 'Published stable compatibility manifest does not match the verified local bytes.'
              }

              git tag -f $legacyTag $sourceSha
              if ($LASTEXITCODE -ne 0) { throw 'Unable to update the local compatibility tag.' }
              git push origin "refs/tags/$legacyTag" --force
              if ($LASTEXITCODE -ne 0) { throw 'Unable to update the remote compatibility tag.' }
              gh release edit $legacyTag --repo $env:GITHUB_REPOSITORY --target $sourceSha `
                --title 'mumble-forked stable compatibility pointer' `
                --notes 'This compatibility release points existing clients to the exact signed immutable qualification.'
              if ($LASTEXITCODE -ne 0) { throw 'Unable to finalize the stable compatibility release.' }

              # The signed modern channel pointer is the final commit point.
              & $publishModernChannel
            } catch {
              $stableFailure = $_
              & $restoreCompatibility
              throw $stableFailure
            }
          }
