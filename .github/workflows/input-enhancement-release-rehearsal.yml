            -ExpectedChallengeId $env:EXPECTED_CHALLENGE_ID -ExpectedChallengeSha256 $env:EXPECTED_CHALLENGE_SHA256 `
            -ExpectedCandidateBuildReceiptSha256 ([string]$challenge.unsigned.candidateBuildReceiptSha256) `
