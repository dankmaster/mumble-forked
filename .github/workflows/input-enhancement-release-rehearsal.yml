            -ExpectedUnsignedStagedPayloadSha256 ([string]$challenge.unsigned.stagedPayloadSha256) `
            -ExpectedSignedTestedBinarySha256 ([string]$challenge.signed.testedBinarySha256) `
            -ExpectedSignedStagedPayloadSha256 ([string]$challenge.signed.stagedPayloadSha256) `
            -ExpectedUnsignedHandoffSha256 $env:UNSIGNED_HANDOFF_ARCHIVE_SHA256 `
            -ExpectedMeasuredEvidenceArchiveSha256 $env:MEASURED_EVIDENCE_ARCHIVE_SHA256 `
            -ExpectedListeningQualificationSha256 $env:LISTENING_QUALIFICATION_SHA256 `
            -ExpectedReleaseSmokeHarnessSha256 $env:RELEASE_SMOKE_HARNESS_SHA256 `
            -ExpectedFixtureManifestSha256 $env:RELEASE_SMOKE_FIXTURE_MANIFEST_SHA256 `
            -ExpectedCaseSetSha256 $env:RELEASE_SMOKE_CASE_SET_SHA256 -ExpectedServerExecutableSha256 $env:RELEASE_SMOKE_SERVER_BINARY_SHA256 `
            -ExpectedKillSwitchObserverSha256 $env:KILL_SWITCH_OBSERVER_SHA256 `
            -ExpectedKillSwitchObserverReceiptSha256 '${{ needs.observe.outputs.kill_receipt_sha256 }}' `
            -ExpectedUpdaterVmExecutorSha256 $env:UPDATER_VM_EXECUTOR_SHA256 -ExpectedUpdaterVmHarnessSha256 $env:UPDATER_VM_HARNESS_SHA256 `
            -ExpectedUpdaterVmReceiptSha256 '${{ needs.observe.outputs.vm_receipt_sha256 }}' `
            -ExpectedUpdaterVmImageSha256 $env:UPDATER_VM_IMAGE_SHA256 -ExpectedUpdaterVmSnapshotSha256 $env:UPDATER_VM_SNAPSHOT_SHA256 `
            -ExpectedUpdaterVmHardwareFingerprintSha256 $env:UPDATER_VM_HARDWARE_FINGERPRINT_SHA256 `
            -ExpectedCommunitySize ([int]$env:REQUESTED_COMMUNITY_SIZE)
          New-Item -ItemType Directory -Force -Path .\remote-reverification | Out-Null
          .\scripts\windows\new-input-enhancement-rehearsal-remote-attestation.ps1 `
            -DraftRoot .\rehearsal-remote -ArtifactName $env:DRAFT_ARTIFACT `
            -SourceSha $env:REQUESTED_SOURCE_SHA -BuildId $env:EXPECTED_BUILD_ID `
            -ChallengeId $env:EXPECTED_CHALLENGE_ID -ChallengeSha256 $env:EXPECTED_CHALLENGE_SHA256 `
            -WorkflowRunId $env:GITHUB_RUN_ID `
            -OutputPath .\remote-reverification\remote-reverification.json
