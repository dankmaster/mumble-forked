          .\scripts\windows\assert-input-enhancement-release-rehearsal.ps1 `
            -Root .\rehearsal-remote -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA -ExpectedBuildId $env:EXPECTED_BUILD_ID `
            -ExpectedDraftArtifactName $env:DRAFT_ARTIFACT `
            -ExpectedEd25519PublicKeyHex ([string]$challenge.ephemeralSigning.ed25519PublicKeyHex) `
