name: Windows Shared Client Installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -Dtests=OFF -Dsymbols=ON -Ddisplay-install-paths=ON -Dtest-lto=OFF
  MUMBLE_ENABLE_WINDOWS_PACKAGING: ON
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE: 2025-11
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG: build-env-2025-11-webengine-codecs
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT: 127cccc01d
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_VERSION_SUFFIX: webengine-codecs-v2
  ONNXRUNTIME_VERSION: 1.18.1
  GSTREAMER_VERSION: 1.26.7

jobs:
  fetch_build_number:
    name: fetch-build-number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default 0)"
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

  build-windows-client-shared:
    name: windows-shared-client-installer
    needs: [ fetch_build_number ]
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run community updater and installer contract tests
        shell: pwsh
        run: |
          $testFiles = @(
            '.\scripts\windows\tests\CommunityReleaseCandidate.Tests.ps1',
            '.\scripts\windows\tests\WindowsCommunityReleaseGate.Tests.ps1',
            '.\scripts\windows\tests\WindowsInstallerUpgradeContract.Tests.ps1',
            '.\scripts\windows\tests\WindowsMsiPayloadContract.Tests.ps1'
          )
          $pester = Get-Module -ListAvailable Pester |
            Where-Object Version -eq ([Version]'3.4.0') |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $pester) {
            Install-Module Pester -RequiredVersion 3.4.0 -Scope CurrentUser `
              -Repository PSGallery -Force -SkipPublisherCheck
            $pester = Get-Module -ListAvailable Pester |
              Where-Object Version -eq ([Version]'3.4.0') |
              Select-Object -First 1
          }
          if ($null -eq $pester) {
            throw 'Pester 3.4.0 is required for the community updater and installer contract tests.'
          }
          Import-Module $pester.Path -Force
          $result = Invoke-Pester -Script $testFiles -PassThru
          if ($result.FailedCount -ne 0) {
            throw "$($result.FailedCount) community updater/installer contract test(s) failed."
          }
          # Expected negative contract cases can leave a native process exit
          # code behind after all Pester assertions have passed.
          $global:LASTEXITCODE = 0

      - name: Initialize submodules with retry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/workflows/update_submodules_with_retry.sh"

      - name: Pin shared codec environment
        shell: bash
        run: |
          echo "MUMBLE_ENVIRONMENT_SOURCE_OVERRIDE=https://github.com/${{ github.repository }}/releases/download/${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_COMMIT_OVERRIDE=${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_VERSION_SUFFIX_OVERRIDE=${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_VERSION_SUFFIX}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_DIR_OVERRIDE=$GITHUB_WORKSPACE/build_env/${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE}-${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT}-shared" >> "$GITHUB_ENV"
          echo "MUMBLE_ALLOW_ENVIRONMENT_BOOTSTRAP=OFF" >> "$GITHUB_ENV"

      - name: Set environment variables
        run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "windows-2022" "shared" "x86_64" "${{ github.workspace }}"
        shell: bash

      - id: restore-shared-build-env-cache
        uses: actions/cache/restore@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - name: Verify shared codec environment archive
        shell: bash
        run: |
          set -euxo pipefail
          archive_url="${MUMBLE_ENVIRONMENT_SOURCE}/${MUMBLE_ENVIRONMENT_VERSION}.7z"
          split_archive_url="${archive_url}.001"
          if ! curl -I -f -L "$archive_url" > /dev/null && ! curl -I -f -L "$split_archive_url" > /dev/null; then
            echo "::error title=Missing shared codec build environment::Publish ${MUMBLE_ENVIRONMENT_VERSION}.7z to ${MUMBLE_ENVIRONMENT_SOURCE} before running this workflow."
            exit 1
          fi

      - id: setup-windows-optional-runtimes
        uses: ./.github/actions/setup-windows-optional-runtimes
        with:
          onnxruntime-version: ${{ env.ONNXRUNTIME_VERSION }}
          gstreamer-version: ${{ env.GSTREAMER_VERSION }}
          rnnoise-model-release-tag: ${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG }}
          install-rust: 'true'
          install-ffmpeg: ${{ github.event_name == 'workflow_dispatch' }}
          install-gstreamer: 'true'

      - name: Install Windows installer tooling
        uses: ./.github/actions/setup-windows-installer-tooling
        with:
          wixsharp-version: '1.19.0.0'

      - name: Build, package, and stage shared WebEngine client
        shell: powershell
        run: |
          $additionalCMakeOptions = @(
            '-Dserver=OFF',
            '-Dmodern-layout-automation=OFF',
            '-Dmodern-layout-mockups=OFF'
          )

          $arguments = @{
            BuildNumber = "${{ needs.fetch_build_number.outputs.build_number }}"
            EnvironmentRelease = "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE }}"
            EnvironmentCommit = "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT }}"
            AdditionalCMakeOptions = $additionalCMakeOptions
            EnablePackaging = $true
            UseBundledCli11 = $true
            AllowPendingReboot = $true
          }
          if ('${{ steps.restore-shared-build-env-cache.outputs.cache-hit }}' -ne 'true') {
            $arguments.InstallDependencies = $true
          }
          .\scripts\windows\build-local-windows-client.ps1 @arguments

      - name: Validate shared Windows client binaries
        shell: powershell
        run: |
          .\scripts\windows\assert-windows-build-artifacts.ps1 `
            -BuildRoot .\build-shared-webengine `
            -StageRoot .\build-shared-webengine\shared-webengine-stage `
            -RequireStage `
            -RequireClient `
            -RequireScreenHelper `
            -RequireSpeechCleanup `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -ArtifactListPath .\build-shared-webengine\windows-binary-artifacts.txt

      - name: Cache verified shared build environment
        if: ${{ steps.restore-shared-build-env-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - name: Cache verified ONNX Runtime
        if: ${{ steps.setup-windows-optional-runtimes.outputs.onnxruntime-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/onnxruntime/win-x64-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-${{ runner.os }}-x64-${{ env.ONNXRUNTIME_VERSION }}

      - name: Cache verified GStreamer runtime
        if: ${{ steps.setup-windows-optional-runtimes.outputs.gstreamer-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/gstreamer/msvc-x86_64-${{ env.GSTREAMER_VERSION }}
          key: gstreamer-${{ runner.os }}-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: Cache verified RNNoise model
        if: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-path }}
          key: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-key }}

      - name: Verify shared helper runtime
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          .\scripts\windows\build-local-windows-client.ps1 `
            -BuildNumber "${{ needs.fetch_build_number.outputs.build_number }}" `
            -EnvironmentRelease "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE }}" `
            -EnvironmentCommit "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT }}" `
            -SkipConfigure `
            -SkipBuild `
            -VerifyHelperRuntime `
            -RequireGStreamerRuntime `
            -AllowPendingReboot

      - name: Validate shared Windows client installer
        shell: powershell
        run: |
          .\scripts\windows\assert-windows-build-artifacts.ps1 `
            -BuildRoot .\build-shared-webengine `
            -RequireClient `
            -RequireClientInstaller `
            -RequireEnglishOnlyInstallers `
            -CandidateExecutablePath .\build-shared-webengine\shared-webengine-stage\mumble.exe `
            -MsiPayloadEvidencePath .\build-shared-webengine\windows-msi-payload-evidence.json `
            -ArtifactListPath .\build-shared-webengine\windows-installer-artifacts.txt

      - name: Publish Shared Client Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Mumble-windows-shared-client-installer-${{ needs.fetch_build_number.outputs.build_number }}
          compression-level: 0
          path: |
            build-shared-webengine/shared-webengine-stage/**
            build-shared-webengine/windows-screen-share-capabilities.json
            build-shared-webengine/windows-screen-share-helper.log
            build-shared-webengine/windows-screen-share-self-test.json
            build-shared-webengine/windows-binary-artifacts.txt
            build-shared-webengine/windows-installer-artifacts.txt
            build-shared-webengine/windows-msi-payload-evidence.json
            build-shared-webengine/windows-client-artifacts.txt
            build-shared-webengine/**/mumble*.msi
            build-shared-webengine/**/mumble*.exe
