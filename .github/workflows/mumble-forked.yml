name: mumble-forked MSI Release

on:
  workflow_dispatch:
    inputs:
      update_announcement:
        description: Short message shown in the in-app update popup
        required: true
        type: string
      release_notes:
        description: Optional extra details shown on GitHub and in the updater details pane
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -Dtests=OFF -Dsymbols=ON -Ddisplay-install-paths=ON -Dtest-lto=OFF
  MUMBLE_FORKED_RELEASE_TAG: mumble-forked
  MUMBLE_FORKED_RELEASE_TITLE: mumble-forked
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE: 2025-11
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG: build-env-2025-11-webengine-codecs
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT: 127cccc01d
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_VERSION_SUFFIX: webengine-codecs-v2
  ONNXRUNTIME_VERSION: 1.18.1
  GSTREAMER_VERSION: 1.26.7
  PROTECTED_BUILD_ENV_RELEASE_TAG: build-env-2025-11-webengine-codecs

jobs:
  build-and-publish-msi:
    name: build-and-publish-msi
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize submodules with retry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/workflows/update_submodules_with_retry.sh"

      - name: Pin shared codec environment
        shell: bash
        run: |
          echo "MUMBLE_ENVIRONMENT_SOURCE_OVERRIDE=https://github.com/${{ github.repository }}/releases/download/${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_COMMIT_OVERRIDE=${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_VERSION_SUFFIX_OVERRIDE=${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_VERSION_SUFFIX}" >> "$GITHUB_ENV"
          echo "MUMBLE_ENVIRONMENT_DIR_OVERRIDE=$GITHUB_WORKSPACE/build_env/${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE}-${MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT}-shared" >> "$GITHUB_ENV"
          echo "MUMBLE_ALLOW_ENVIRONMENT_BOOTSTRAP=OFF" >> "$GITHUB_ENV"

      - name: Set environment variables
        shell: bash
        run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "windows-2022" "shared" "x86_64" "${{ github.workspace }}"

      - name: Verify shared codec environment archive
        shell: bash
        run: |
          set -euxo pipefail
          archive_url="${MUMBLE_ENVIRONMENT_SOURCE}/${MUMBLE_ENVIRONMENT_VERSION}.7z"
          split_archive_url="${archive_url}.001"
          if ! curl -I -f -L "$archive_url" > /dev/null && ! curl -I -f -L "$split_archive_url" > /dev/null; then
            echo "::error title=Missing shared codec build environment::Publish ${MUMBLE_ENVIRONMENT_VERSION}.7z to ${MUMBLE_ENVIRONMENT_SOURCE} before running this workflow."
            exit 1
          fi

      - id: restore-shared-build-env-cache
        uses: actions/cache/restore@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - id: setup-windows-optional-runtimes
        uses: ./.github/actions/setup-windows-optional-runtimes
        with:
          onnxruntime-version: ${{ env.ONNXRUNTIME_VERSION }}
          gstreamer-version: ${{ env.GSTREAMER_VERSION }}
          rnnoise-model-release-tag: ${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG }}
          install-rust: 'true'
          install-ffmpeg: 'true'
          install-gstreamer: 'true'

      - name: Install Windows installer tooling
        uses: ./.github/actions/setup-windows-installer-tooling
        with:
          wixsharp-version: '1.19.0.0'

      - name: Build Windows client MSI
        shell: powershell
        run: |
          $arguments = @{
            BuildNumber = "${{ github.run_number }}"
            EnvironmentRelease = "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE }}"
            EnvironmentCommit = "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT }}"
            AdditionalCMakeOptions = @(
              '-Dserver=OFF',
              '-Dmodern-layout-automation=OFF',
              '-Dmodern-layout-mockups=OFF',
              '-Dunsigned-community-release=ON'
            )
            EnablePackaging = $true
            UseBundledCli11 = $true
            AllowPendingReboot = $true
          }
          if ('${{ steps.restore-shared-build-env-cache.outputs.cache-hit }}' -ne 'true') {
            $arguments.InstallDependencies = $true
          }
          .\scripts\windows\build-local-windows-client.ps1 @arguments

      - name: Verify packaged GStreamer screen-share runtime
        timeout-minutes: 10
        shell: powershell
        run: |
          .\scripts\windows\build-local-windows-client.ps1 `
            -BuildNumber "${{ github.run_number }}" `
            -EnvironmentRelease "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE }}" `
            -EnvironmentCommit "${{ env.MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT }}" `
            -SkipConfigure `
            -SkipBuild `
            -VerifyHelperRuntime `
            -RequireGStreamerRuntime `
            -AllowPendingReboot

      - name: Validate mumble-forked MSI artifacts
        shell: powershell
        run: |
          .\scripts\windows\assert-windows-build-artifacts.ps1 `
            -BuildRoot .\build-shared-webengine `
            -StageRoot .\build-shared-webengine\shared-webengine-stage `
            -RequireStage `
            -RequireClient `
            -RequireScreenHelper `
            -RequireSpeechCleanup `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -RequireClientInstaller `
            -RequireEnglishOnlyInstallers `
            -CandidateExecutablePath .\build-shared-webengine\shared-webengine-stage\mumble.exe `
            -MsiPayloadEvidencePath .\build-shared-webengine\windows-msi-payload-evidence.json `
            -ArtifactListPath .\build-shared-webengine\mumble-forked-artifacts.txt

      - name: Prepare release assets
        id: prepare-assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MUMBLE_FORKED_UPDATE_ANNOUNCEMENT: ${{ inputs.update_announcement }}
          MUMBLE_FORKED_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "build-shared-webengine\mumble-forked-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $announcement = ([string]$env:MUMBLE_FORKED_UPDATE_ANNOUNCEMENT).Trim()
          if ([string]::IsNullOrWhiteSpace($announcement)) {
            throw "The mumble-forked update announcement is required. Re-run the workflow with a short user-facing update message."
          }
          $releaseNotes = ([string]$env:MUMBLE_FORKED_RELEASE_NOTES).Trim()

          function Get-PreviousForkedReleaseCommit {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Tag
            )

            $remoteRows = @(git ls-remote origin "refs/tags/${Tag}" "refs/tags/${Tag}^{}" 2>$null)
            if ($LASTEXITCODE -ne 0 -or $remoteRows.Count -eq 0) {
              return ""
            }

            git fetch --force --no-tags origin "refs/tags/${Tag}:refs/tags/${Tag}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Unable to fetch previous '$Tag' tag locally; changelog will start from this build."
              return ""
            }

            $commit = (git rev-list -n 1 $Tag 2>$null)
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Unable to resolve previous '$Tag' tag commit; changelog will start from this build."
              return ""
            }

            return ([string]$commit).Trim()
          }

          function Get-ReleaseAssetNameFromUrl {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Url
            )

            $uri = [Uri]$Url
            $name = [Uri]::UnescapeDataString([IO.Path]::GetFileName($uri.AbsolutePath))
            if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'github.com' -or
                $name -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Previous mumble-forked release contains an unsafe asset URL: $Url"
            }
            return $name
          }

          function Get-VerifiedReleaseAsset {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Tag,
              [Parameter(Mandatory = $true)]
              [string]$AssetName,
              [Parameter(Mandatory = $true)]
              [string]$ExpectedSha256,
              [Parameter(Mandatory = $true)]
              [int64]$ExpectedSize,
              [Parameter(Mandatory = $true)]
              [string]$DestinationDirectory
            )

            if ($AssetName -notmatch '^[A-Za-z0-9._-]+$' -or
                $ExpectedSha256 -notmatch '^[0-9A-Fa-f]{64}$' -or $ExpectedSize -le 0) {
              throw "Previous mumble-forked release asset metadata is invalid for '$AssetName'."
            }
            New-Item -ItemType Directory -Force -Path $DestinationDirectory | Out-Null
            $downloadOutput = @(gh release download $Tag --repo $env:GITHUB_REPOSITORY --pattern $AssetName `
              --dir $DestinationDirectory --clobber 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download previous mumble-forked asset '$AssetName': $($downloadOutput -join ' ')"
            }
            $downloadOutput | ForEach-Object { Write-Host $_ }
            $path = Join-Path $DestinationDirectory $AssetName
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            $actualSha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
            if ([int64]$item.Length -ne $ExpectedSize -or $actualSha256 -cne $ExpectedSha256.ToUpperInvariant()) {
              throw "Previous mumble-forked asset '$AssetName' failed its published size/SHA256 check."
            }
            return $item.FullName
          }

          function New-AutomatedChangelog {
            param(
              [string]$PreviousCommit,
              [Parameter(Mandatory = $true)]
              [string]$CurrentCommit,
              [Parameter(Mandatory = $true)]
              [string]$Repository
            )

            if (-not [string]::IsNullOrWhiteSpace($PreviousCommit)) {
              git cat-file -e "$PreviousCommit^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Previous mumble-forked commit '$PreviousCommit' is not available locally; changelog will start from this build."
                $PreviousCommit = ""
              }
            }

            $currentShort = $CurrentCommit.Substring(0, 12)
            $lines = New-Object System.Collections.Generic.List[string]
            $lines.Add("## Changelog")
            $lines.Add("")

            if ([string]::IsNullOrWhiteSpace($PreviousCommit)) {
              $lines.Add("No previous mumble-forked MSI tag was found, so this build starts the automated changelog history.")
              $logArgs = @("--first-parent", "--max-count=25", "--reverse", "--format=%h%x09%s", $CurrentCommit, "--")
            } elseif ($PreviousCommit -eq $CurrentCommit) {
              $previousShort = $PreviousCommit.Substring(0, 12)
              $lines.Add("No source changes since the previous mumble-forked MSI (``$previousShort``).")
              $logArgs = @()
            } else {
              $previousShort = $PreviousCommit.Substring(0, 12)
              $lines.Add("Changes from ``$previousShort`` to ``$currentShort``.")
              $lines.Add("")
              $lines.Add("[Full comparison](https://github.com/$Repository/compare/$PreviousCommit...$CurrentCommit)")
              $logArgs = @("--first-parent", "--reverse", "--format=%h%x09%s", "$PreviousCommit..$CurrentCommit", "--")
            }

            if ($logArgs.Count -gt 0) {
              $rawEntries = @(git log @logArgs)
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to generate automated mumble-forked changelog."
              }

              if ($rawEntries.Count -gt 0) {
                $lines.Add("")
                foreach ($entry in $rawEntries) {
                  $parts = ([string]$entry) -split "`t", 2
                  if ($parts.Count -eq 2) {
                    $lines.Add("- $($parts[0]) $($parts[1])")
                  }
                }
              } elseif (-not [string]::IsNullOrWhiteSpace($PreviousCommit) -and $PreviousCommit -ne $CurrentCommit) {
                $lines.Add("")
                $lines.Add("- No first-parent commits were found in this range.")
              }
            }

            return ($lines -join "`n").Trim()
          }

          $clientMsi = Get-ChildItem -Path ".\build-shared-webengine" -Recurse -File -Filter "*client*.msi" |
            Sort-Object -Property LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $clientMsi) {
            throw "Unable to locate a shared client MSI under build-shared-webengine."
          }

          $buildNumber = "${{ github.run_number }}"
          $projectVersion = "1.7.$buildNumber"
          $currentCommit = "${{ github.sha }}"
          $assetName = "mumble-forked-$projectVersion.msi"
          $assetPath = Join-Path $releaseDir $assetName
          Copy-Item -LiteralPath $clientMsi.FullName -Destination $assetPath -Force

          $hash = Get-FileHash -LiteralPath $assetPath -Algorithm SHA256
          $hashPath = "$assetPath.sha256"
          Set-Content -LiteralPath $hashPath -Value "$($hash.Hash)  $assetName"

          $baseReleaseRoot = Join-Path $releaseDir 'previous-release'
          $baseManifestPath = ''
          $baseManifestSha256 = ''
          $baseCommit = ''
          $baseBuild = 0
          $baseSourceKind = 'none'
          $releaseViewOutput = @(gh release view "${{ env.MUMBLE_FORKED_RELEASE_TAG }}" `
            --repo $env:GITHUB_REPOSITORY --json tagName --jq '.tagName' 2>&1)
          if ($LASTEXITCODE -eq 0) {
            New-Item -ItemType Directory -Force -Path $baseReleaseRoot | Out-Null
            gh release download "${{ env.MUMBLE_FORKED_RELEASE_TAG }}" --repo $env:GITHUB_REPOSITORY `
              --pattern 'mumble-forked-update.json' --dir $baseReleaseRoot --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to download the previous mumble-forked update manifest."
            }
            $previousUpdateManifestPath = Join-Path $baseReleaseRoot 'mumble-forked-update.json'
            $previousUpdate = Get-Content -LiteralPath $previousUpdateManifestPath -Raw | ConvertFrom-Json
            $previousPackage = $previousUpdate.package
            if ([int]$previousUpdate.manifestVersion -ne 2 -or
                [string]$previousUpdate.commit -notmatch '^[0-9a-f]{40}$' -or
                [int]$previousUpdate.build -le 0 -or
                [string]$previousPackage.sha256 -notmatch '^[0-9A-Fa-f]{64}$' -or
                [int64]$previousPackage.size -le 0) {
              throw "The previous mumble-forked update manifest is not a usable sparse-package base."
            }
            $baseCommit = [string]$previousUpdate.commit
            $baseBuild = [int]$previousUpdate.build

            if ($null -ne $previousPackage.fileManifest) {
              $fileManifestAsset = $previousPackage.fileManifest
              $fileManifestName = Get-ReleaseAssetNameFromUrl -Url ([string]$fileManifestAsset.url)
              $baseManifestPath = Get-VerifiedReleaseAsset `
                -Tag "${{ env.MUMBLE_FORKED_RELEASE_TAG }}" `
                -AssetName $fileManifestName `
                -ExpectedSha256 ([string]$fileManifestAsset.sha256) `
                -ExpectedSize ([int64]$fileManifestAsset.size) `
                -DestinationDirectory $baseReleaseRoot
              $baseSourceKind = 'standalone-file-manifest'
            } else {
              # One-time bridge for releases published before the standalone
              # file manifest existed. Verify the old full package, then read
              # only its manifest.json. Future releases avoid this 390 MiB
              # bootstrap download.
              $previousPackageName = Get-ReleaseAssetNameFromUrl -Url ([string]$previousPackage.url)
              $previousPackagePath = Get-VerifiedReleaseAsset `
                -Tag "${{ env.MUMBLE_FORKED_RELEASE_TAG }}" `
                -AssetName $previousPackageName `
                -ExpectedSha256 ([string]$previousPackage.sha256) `
                -ExpectedSize ([int64]$previousPackage.size) `
                -DestinationDirectory $baseReleaseRoot
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $baseManifestPath = Join-Path $baseReleaseRoot 'mumble-forked-update-files.json'
              $archive = [System.IO.Compression.ZipFile]::OpenRead($previousPackagePath)
              try {
                $manifestEntries = @($archive.Entries | Where-Object { $_.FullName -ceq 'manifest.json' })
                if ($manifestEntries.Count -ne 1) {
                  throw "The previous mumble-forked package does not contain exactly one manifest.json."
                }
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile(
                  $manifestEntries[0], $baseManifestPath, $true)
              } finally {
                $archive.Dispose()
              }
              $baseSourceKind = 'verified-legacy-package'
            }

            $baseFileManifest = Get-Content -LiteralPath $baseManifestPath -Raw | ConvertFrom-Json
            if ([string]$baseFileManifest.commit -cne $baseCommit -or
                [int]$baseFileManifest.build -ne $baseBuild) {
              throw "The previous update file manifest is not bound to the published previous release."
            }
            $baseManifestSha256 =
              (Get-FileHash -LiteralPath $baseManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          }

          $packageName = "mumble-forked-$projectVersion.mumble-update"
          $packagePath = Join-Path $releaseDir $packageName
          $packageMetadataPath = Join-Path $releaseDir 'mumble-forked-update-package.json'
          $fileManifestName = 'mumble-forked-update-files.json'
          $fileManifestPath = Join-Path $releaseDir $fileManifestName
          $packageArguments = @{
            StageRoot = ".\build-shared-webengine\shared-webengine-stage"
            OutputPath = $packagePath
            Version = $projectVersion
            Build = [int]$buildNumber
            Commit = $currentCommit
            ManifestOutPath = $packageMetadataPath
            TargetManifestOutPath = $fileManifestPath
            RequireUpdaterRuntime = $true
            RequireGStreamerRuntime = $true
            Validate = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($baseManifestPath)) {
            $packageArguments.BaseManifestPath = $baseManifestPath
            $packageArguments.ExpectedBaseManifestSha256 = $baseManifestSha256
          }
          .\scripts\windows\create-windows-update-package.ps1 @packageArguments
          $packageMetadata = Get-Content -LiteralPath $packageMetadataPath -Raw | ConvertFrom-Json
          $packageHash = Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
          $packageHashPath = "$packagePath.sha256"
          Set-Content -LiteralPath $packageHashPath -Value "$($packageHash.Hash)  $packageName"
          $packageSize = (Get-Item -LiteralPath $packagePath).Length
          $fileManifestHash = Get-FileHash -LiteralPath $fileManifestPath -Algorithm SHA256
          $fileManifestSize = (Get-Item -LiteralPath $fileManifestPath).Length

          $notesPath = Join-Path $releaseDir "release-notes.md"
          $changelogPath = Join-Path $releaseDir "changelog.md"
          $manifestPath = Join-Path $releaseDir "mumble-forked-update.json"
          $previewPath = Join-Path $releaseDir "update-announcement-preview.txt"
          $shortSha = $currentCommit.Substring(0, 12)
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ env.MUMBLE_FORKED_RELEASE_TAG }}"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.MUMBLE_FORKED_RELEASE_TAG }}/$assetName"
          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.MUMBLE_FORKED_RELEASE_TAG }}/$packageName"
          $fileManifestUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.MUMBLE_FORKED_RELEASE_TAG }}/$fileManifestName"
          $previousCommit = Get-PreviousForkedReleaseCommit -Tag "${{ env.MUMBLE_FORKED_RELEASE_TAG }}"
          $changelog = New-AutomatedChangelog -PreviousCommit $previousCommit -CurrentCommit $currentCommit -Repository "${{ github.repository }}"
          [System.IO.File]::WriteAllText($changelogPath, "$changelog`n", [System.Text.UTF8Encoding]::new($false))

          $manifest = [ordered]@{
            manifestVersion = 2
            name = "mumble-forked"
            version = $projectVersion
            build = [int]$buildNumber
            commit = $currentCommit
            previousCommit = $previousCommit
            branch = "${{ github.ref_name }}"
            announcement = $announcement
            releaseNotes = $releaseNotes
            changelog = $changelog
            releaseUrl = $releaseUrl
            installerUrl = $installerUrl
            sha256 = $hash.Hash
            installer = [ordered]@{
              format = "msi"
              url = $installerUrl
              sha256 = $hash.Hash
              size = [int64](Get-Item -LiteralPath $assetPath).Length
            }
            package = [ordered]@{
              format = "mumble-update-v1"
              url = $packageUrl
              sha256 = $packageHash.Hash
              size = [int64]$packageSize
              # Updater-v2 clients reject this package and use the verified MSI
              # fields above. Current updater-v4 clients select the package.
              minUpdaterVersion = 3
              applyMode = "replace-staged-payload"
              payloadMode = [string]$packageMetadata.payloadMode
              payloadFileCount = [int]$packageMetadata.payloadFileCount
              targetFileCount = [int]$packageMetadata.targetFileCount
              removedFileCount = [int]$packageMetadata.removedFileCount
              baseCommit = [string]$packageMetadata.baseCommit
              baseBuild = [int]$packageMetadata.baseBuild
              baseManifestSha256 = [string]$packageMetadata.baseManifestSha256
              fileManifest = [ordered]@{
                url = $fileManifestUrl
                sha256 = $fileManifestHash.Hash
                size = [int64]$fileManifestSize
              }
            }
            preferredUpdate = "package"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText($manifestPath, $manifestJson, [System.Text.UTF8Encoding]::new($false))

          $notesLines = New-Object System.Collections.Generic.List[string]
          $notesLines.Add("# mumble-forked")
          $notesLines.Add("")
          $notesLines.Add($announcement)
          if (-not [string]::IsNullOrWhiteSpace($releaseNotes)) {
            $notesLines.Add("")
            $notesLines.Add("## Release notes")
            $notesLines.Add("")
            $notesLines.Add($releaseNotes)
          }
          if (-not [string]::IsNullOrWhiteSpace($changelog)) {
            $notesLines.Add("")
            $notesLines.Add($changelog)
          }
          $notesLines.Add("")
          $notesLines.Add("- Announcement: $announcement")
          $notesLines.Add("- Version: $projectVersion")
          $notesLines.Add("- Build: $buildNumber")
          $notesLines.Add("- Commit: $currentCommit")
          if (-not [string]::IsNullOrWhiteSpace($previousCommit)) {
            $notesLines.Add("- Previous mumble-forked commit: $previousCommit")
          }
          $notesLines.Add("- Branch/ref: ${{ github.ref_name }}")
          $notesLines.Add("- Installer: $assetName")
          $notesLines.Add("- SHA256: $($hash.Hash)")
          $notesLines.Add("- Update package: $packageName")
          $notesLines.Add("- Update package SHA256: $($packageHash.Hash)")
          $notesLines.Add("- Update package payload: $($packageMetadata.payloadFileCount)/$($packageMetadata.targetFileCount) files ($($packageMetadata.payloadMode))")
          if (-not [string]::IsNullOrWhiteSpace($baseCommit)) {
            $notesLines.Add("- Sparse base: build $baseBuild, commit $baseCommit ($baseSourceKind)")
          }
          $notesLines.Add("- Preferred update path: changed-file package; verified MSI is downloaded only after package failure by current clients")
          $notesLines.Add("")
          $notesLines.Add("Windows may show a SmartScreen warning because this is not an official signed public release.")
          [System.IO.File]::WriteAllLines($notesPath, $notesLines, [System.Text.UTF8Encoding]::new($false))

          $previewLines = @(
            "Mumble update available",
            "",
            "A new mumble-forked build is available.",
            $announcement,
            "",
            "Current clients below build $buildNumber will see:",
            "Latest: $projectVersion, build $buildNumber",
            "Details: automated changelog from the previous mumble-forked MSI",
            "Current client package: $packageUrl",
            "Older client MSI fallback: $installerUrl",
            "",
            "Update metadata:",
            "preferredUpdate: package",
            "older-client fallback: verified MSI",
            "package payload: $($packageMetadata.payloadFileCount)/$($packageMetadata.targetFileCount) files ($($packageMetadata.payloadMode))"
          )
          [System.IO.File]::WriteAllLines($previewPath, $previewLines, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Updater announcement preview:"
          Get-Content -LiteralPath $previewPath | ForEach-Object { Write-Host $_ }

          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT
          "hash_path=$hashPath" >> $env:GITHUB_OUTPUT
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT
          "package_hash_path=$packageHashPath" >> $env:GITHUB_OUTPUT
          "file_manifest_path=$fileManifestPath" >> $env:GITHUB_OUTPUT
          "changelog_path=$changelogPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          "preview_path=$previewPath" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Replace mumble-forked release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:MUMBLE_FORKED_RELEASE_TAG
          $protectedTag = $env:PROTECTED_BUILD_ENV_RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "MUMBLE_FORKED_RELEASE_TAG is empty."
          }
          if ($tag -eq $protectedTag -or $tag -like "build-env-*") {
            throw "Refusing to publish mumble-forked over protected build environment tag '$protectedTag'."
          }

          $currentMaster = git ls-remote origin "refs/heads/master"
          $currentMasterSha = if ($currentMaster) { ($currentMaster -split "\s+")[0] } else { "" }
          if (-not [string]::IsNullOrWhiteSpace($currentMasterSha) -and $currentMasterSha -ne $env:GITHUB_SHA) {
            Write-Warning "Skipping mumble-forked release publish because this run is no longer current master. Run SHA: $env:GITHUB_SHA; master SHA: $currentMasterSha."
            exit 0
          }

          $releaseRows = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          foreach ($releaseRow in $releaseRows) {
            $releaseTag = [string]$releaseRow.tagName
            if ($releaseTag -eq $protectedTag -or $releaseTag -like "build-env-*") {
              Write-Host "Preserving protected release '$releaseTag'."
              continue
            }
            if ($releaseTag -eq $tag -or $releaseTag -like "$tag-*") {
              Write-Host "Deleting previous mumble-forked release '$releaseTag'."
              gh release delete $releaseTag --repo $env:GITHUB_REPOSITORY --yes
            }
          }

          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force

          gh release create $tag `
            "${{ steps.prepare-assets.outputs.asset_path }}" `
            "${{ steps.prepare-assets.outputs.hash_path }}" `
            "${{ steps.prepare-assets.outputs.package_path }}" `
            "${{ steps.prepare-assets.outputs.package_hash_path }}" `
            "${{ steps.prepare-assets.outputs.file_manifest_path }}" `
            "${{ steps.prepare-assets.outputs.changelog_path }}" `
            "${{ steps.prepare-assets.outputs.manifest_path }}" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title $env:MUMBLE_FORKED_RELEASE_TITLE `
            --notes-file "${{ steps.prepare-assets.outputs.notes_path }}"

      - name: Publish mumble-forked MSI workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: mumble-forked-msi-and-update-package
          compression-level: 0
          path: |
            build-shared-webengine/mumble-forked-release/mumble-forked-*.msi
            build-shared-webengine/mumble-forked-release/mumble-forked-*.msi.sha256
            build-shared-webengine/mumble-forked-release/mumble-forked-*.mumble-update
            build-shared-webengine/mumble-forked-release/mumble-forked-*.mumble-update.sha256
            build-shared-webengine/mumble-forked-release/mumble-forked-update-files.json
            build-shared-webengine/mumble-forked-release/changelog.md
            build-shared-webengine/mumble-forked-release/mumble-forked-update.json
            build-shared-webengine/mumble-forked-release/release-notes.md
            build-shared-webengine/mumble-forked-release/update-announcement-preview.txt
            build-shared-webengine/mumble-forked-artifacts.txt
            build-shared-webengine/windows-msi-payload-evidence.json

      - if: ${{ steps.restore-shared-build-env-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - if: ${{ steps.setup-windows-optional-runtimes.outputs.onnxruntime-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/onnxruntime/win-x64-${{ env.ONNXRUNTIME_VERSION }}
          key: onnxruntime-${{ runner.os }}-x64-${{ env.ONNXRUNTIME_VERSION }}

      - if: ${{ steps.setup-windows-optional-runtimes.outputs.gstreamer-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/gstreamer/msvc-x86_64-${{ env.GSTREAMER_VERSION }}
          key: gstreamer-${{ runner.os }}-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - if: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-path }}
          key: ${{ steps.setup-windows-optional-runtimes.outputs.rnnoise-model-cache-key }}
