name: Deprecated mumble-forked release guard

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: This legacy publisher is disabled; use Input Enhancement Qualified Windows Build and Promote
        required: false
        type: string

permissions:
  contents: read

jobs:
  legacy-release-disabled:
    name: legacy-release-disabled
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse unqualified publication
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Legacy release path disabled

          This workflow previously rebuilt and published an unsigned MSI directly and
          deleted historical `mumble-forked-*` releases. That bypassed the immutable
          input-enhancement qualification, exact-artifact release smoke, Authenticode,
          detached Ed25519 manifests, and protected promotion environments.

          Use these workflows instead:

          1. `Input Enhancement Quality`
          2. `Input Enhancement Qualified Windows Build`
          3. `Input Enhancement Promote`
          EOF
          echo "::error title=Legacy publisher disabled::Use the qualified build and protected promotion workflows."
          exit 1
