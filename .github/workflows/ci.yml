name: CI

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_OPTIONS: -Dtests=ON -Dsymbols=ON -Ddisplay-install-paths=ON -Dtest-lto=OFF
  ONNXRUNTIME_VERSION: 1.18.1

jobs:
  pr-hygiene:
    name: pr-hygiene
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install hygiene tools
        run: sudo apt install python3 ripgrep
        shell: bash

      - uses: actions/checkout@v6
        with:
          # Assume that there are not >200 new commits that need checking.
          fetch-depth: 200
          # Don't create a merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate input-enhancement corpus lock
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/audio-quality/validate-corpus-lock.py" --self-test

      - name: Check input-enhancement transport boundary
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          python3 "$GITHUB_WORKSPACE/scripts/audio-quality/check-input-enhancement-boundary.py" \
            --self-test \
            --base FETCH_HEAD

      - name: Initialize submodules with retry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/workflows/update_submodules_with_retry.sh"

      - name: Enforce the Qt Quick Modern-only source boundary
        shell: pwsh
        run: ./scripts/windows/verify-modern-only.ps1 -Strict

      - name: Check commit style
        run: $GITHUB_WORKSPACE/.github/workflows/check_commit_style.py ${{ github.base_ref }}
        shell: bash

      - name: Check line endings
        # Pinned from erclu/check-crlf@master.
        uses: erclu/check-crlf@c77fda0a97ea8944aba5f72796b9e937e7d1611c
        with:
          exclude: '3rdparty/'

      - uses: ./.github/actions/install-dependencies
        with:
          type: shared
          os: ubuntu-latest
          arch: x86_64

      - name: Generate compile-command DB
        run: >-
          mkdir build; cd build;
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -Dclient=OFF -Dserver=ON -Dtests=OFF -Dscreen-helper=OFF ..;
          cd ..; ln -s build/compile_commands.json .
        shell: bash

      - name: Find changed source files
        id: changed-format-files
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=200 origin "${{ github.base_ref }}"
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT FETCH_HEAD...HEAD)
          source_files=()

          for file in "${changed_files[@]}"; do
            case "$file" in
              3rdparty/*|build/*|*.proto)
                continue
                ;;
              *.c|*.C|*.cc|*.cpp|*.cxx|*.c++|*.h|*.H|*.hh|*.hpp|*.hxx|*.h++|*.ino|*.pde|*.cu)
                source_files+=( "$file" )
                ;;
            esac
          done

          if [[ "${#source_files[@]}" -eq 0 ]]; then
            echo "No changed C/C++/CUDA files need clang-format checks."
            echo "has_source_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Changed source file: %s\n' "${source_files[@]}"
          source_file_list="${RUNNER_TEMP}/changed-format-files.txt"
          printf '%s\n' "${source_files[@]}" > "$source_file_list"

          echo "has_source_changes=true" >> "$GITHUB_OUTPUT"
          echo "source_file_list=$source_file_list" >> "$GITHUB_OUTPUT"

      - name: Check code formatting
        if: steps.changed-format-files.outputs.has_source_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --user clang-format==10.0.1

          mapfile -t source_files < "${{ steps.changed-format-files.outputs.source_file_list }}"
          readarray -t clang_tools < <(python3 - <<'PY'
          import clang_format
          import os

          bin_dir = os.path.join(os.path.dirname(clang_format.__file__), "data", "bin")
          print(os.path.join(bin_dir, "git-clang-format"))
          print(os.path.join(bin_dir, "clang-format"))
          PY
          )
          git_clang_format="${clang_tools[0]}"
          clang_format="${clang_tools[1]}"

          # Check only the lines changed by this PR. Several legacy files touched by fork features are
          # not fully clang-format-clean, and whole-file checks would force unrelated formatting churn.
          format_output="$(python3 "$git_clang_format" --binary "$clang_format" --diff FETCH_HEAD -- "${source_files[@]}")"
          printf '%s\n' "$format_output"
          if grep -q '^diff --git ' <<< "$format_output"; then
            printf '%s\n' "$format_output" > "$GITHUB_WORKSPACE/failing-files.txt"
            exit 1
          fi

  fetch_build_number:
    name: fetch-build-number
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.fetch.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: fetch
        shell: bash
        run: |
          build_version="$("${{ github.workspace }}/scripts/mumble-version.py")"
          build_number="$("${{ github.workspace }}/scripts/mumble-build-number.py" \
            --commit "${{ github.sha }}" --version "${build_version}" \
            --password "${{ secrets.BUILD_NUMBER_TOKEN }}" --default 0)"
          echo "Build Number: ${build_version}.${build_number}"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"

  windows-client-server:
    name: windows-client-server
    needs: [ fetch_build_number ]
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Initialize submodules with retry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/workflows/update_submodules_with_retry.sh"

      - name: Set environment variables
        run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "windows-2025-vs2026" "static" "x86_64" "${{ github.workspace }}"
        shell: bash

      - name: Select Windows CI build components
        shell: bash
        run: |
          set -euxo pipefail
          # Qt WebEngine does not support static builds. The native Qt Quick
          # desktop client is gated by windows-shared-client.yml; this static
          # lane remains the Windows server/package gate.
          echo "MUMBLE_BUILD_CLIENT=OFF" >> "$GITHUB_ENV"
          echo "MUMBLE_BUILD_SERVER=ON" >> "$GITHUB_ENV"
          echo "MUMBLE_ENABLE_WINDOWS_PACKAGING=ON" >> "$GITHUB_ENV"
          echo "CMAKE_OPTIONS=${CMAKE_OPTIONS} -Dtests=OFF -Dmodern-layout-automation=OFF -Dmodern-layout-mockups=OFF" >> "$GITHUB_ENV"

      - id: restore-build-env-cache
        uses: actions/cache/restore@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - uses: ./.github/actions/install-dependencies
        with:
          type: static
          os: windows-2025-vs2026
          arch: x86_64

      - name: Build
        run: ./.github/workflows/build.sh "windows-2025-vs2026" "static" "x86_64"
        shell: bash
        env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

      - name: Validate Windows Server Binary Set
        shell: powershell
        run: |
          .\scripts\windows\assert-windows-build-artifacts.ps1 `
            -BuildRoot .\build `
            -RequireServer `
            -ArtifactListPath .\build\windows-binary-artifacts.txt

      - name: Validate Windows Server Installer
        shell: powershell
        run: |
          .\scripts\windows\assert-windows-build-artifacts.ps1 `
            -BuildRoot .\build `
            -RequireServer `
            -RequireServerInstaller `
            -RequireEnglishOnlyInstallers `
            -ArtifactListPath .\build\windows-installer-artifacts.txt

      - name: Publish Windows Server Artifacts
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: 'Mumble-windows-server'
          compression-level: 0
          path: |
            build/windows-binary-artifacts.txt
            build/windows-installer-artifacts.txt
            build/installer/server/*server*.msi
            build/installer/server/*_server-*.exe

      - if: ${{ github.event_name != 'pull_request' && steps.restore-build-env-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

  linux-server:
    name: linux-server
    needs: [ fetch_build_number ]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Test Linux Murmur evidence gate
        shell: bash
        run: python3 scripts/linux/tests/test-create-murmur-evidence.py

      - name: Initialize submodules with retry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/workflows/update_submodules_with_retry.sh"

      - name: Set environment variables
        run: $GITHUB_WORKSPACE/.github/workflows/set_environment_variables.sh "ubuntu-24.04" "static" "x86_64" "${{ github.workspace }}"
        shell: bash

      - name: Select Linux CI build components
        shell: bash
        run: |
          set -euxo pipefail
          echo "MUMBLE_BUILD_CLIENT=OFF" >> "$GITHUB_ENV"
          echo "MUMBLE_BUILD_SERVER=ON" >> "$GITHUB_ENV"
          echo "CMAKE_OPTIONS=${CMAKE_OPTIONS} -Dscreen-helper=OFF -Ddatabase-mysql-tests=OFF -Ddatabase-postgresql-tests=OFF" >> "$GITHUB_ENV"

      - id: restore-build-env-cache
        uses: actions/cache/restore@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}

      - uses: ./.github/actions/install-dependencies
        with:
          type: static
          os: ubuntu-24.04
          arch: x86_64

      - name: Build
        run: ./.github/workflows/build.sh "ubuntu-24.04" "static" "x86_64"
        shell: bash
        env:
          MUMBLE_BUILD_NUMBER: ${{ needs.fetch_build_number.outputs.build_number }}

      - name: Test Linux Server
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: ctest --output-on-failure --output-junit linux-murmur-ctest.xml -C $BUILD_TYPE

      - name: Record Linux Server Evidence
        shell: bash
        run: >-
          bash scripts/linux/create-murmur-evidence.sh
          --server-binary build/mumble-server
          --output build/linux-murmur-test-evidence.json
          --candidate-git-sha "${{ github.sha }}"
          --build-number "${{ needs.fetch_build_number.outputs.build_number }}"
          --configuration linux-x86_64-static-release-tests
          --cmake-cache build/CMakeCache.txt
          --test-results build/linux-murmur-ctest.xml

      - name: Publish Linux Server Artifacts
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: 'Mumble-linux-server'
          compression-level: 0
          path: |
            build/mumble-server
            build/linux-murmur-ctest.xml
            build/linux-murmur-test-evidence.json

      - if: ${{ github.event_name != 'pull_request' && steps.restore-build-env-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: '${{ env.MUMBLE_ENVIRONMENT_DIR }}'
          key: ${{ env.MUMBLE_ENVIRONMENT_VERSION }}
