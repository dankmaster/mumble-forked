name: Input Enhancement Qualified Windows Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character source SHA to build
        required: true
        type: string
      build_number:
        description: Positive immutable product build number
        required: true
        type: number
      quality_run_id:
        description: Successful 500+ case master_quality run for this exact SHA and staged binary
        required: true
        type: string
      nightly_quality_run_id:
        description: Successful 5000+ case nightly/60-minute-soak run for the same exact staged binary
        required: true
        type: string
      release_notes:
        description: Optional qualification notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: input-enhancement-qualified-${{ inputs.build_number }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE: 2025-11
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_RELEASE_TAG: build-env-2025-11-webengine-codecs
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_COMMIT: 127cccc01d
  MUMBLE_SHARED_WINDOWS_ENVIRONMENT_VERSION_SUFFIX: webengine-codecs-v1
  ONNXRUNTIME_VERSION: 1.18.1
  GSTREAMER_VERSION: 1.26.7

jobs:
  build-test-sign:
    name: build-test-sign
    # Fail closed until a verifier binds this exact candidate to successful
    # pre-Azure rehearsal, protected listening/VM receipts, and >=7d/20h
    # dogfood evidence. Quality run IDs alone must never obtain OIDC or sign.
    if: ${{ github.repository == '__disabled__/until-pre-azure-evidence-verifier-v1' }}
    runs-on: windows-2022
    environment: release-preview
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
      INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX }}
      INPUT_ENHANCEMENT_QUALITY_HARNESS_SHA256: ${{ vars.INPUT_ENHANCEMENT_QUALITY_HARNESS_SHA256 }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      QUALITY_RUN_ID: ${{ inputs.quality_run_id }}
      NIGHTLY_QUALITY_RUN_ID: ${{ inputs.nightly_quality_run_id }}
    outputs:
      build_id: ${{ steps.metadata.outputs.build_id }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify requested source and release tooling
        id: metadata
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            throw "Qualified signing builds must be dispatched from the protected master workflow ref."
          }
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $requestedSha = Assert-FullGitSha -Sha $env:REQUESTED_SOURCE_SHA
          $actualSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualSha -cne $requestedSha) {
            throw "Checkout SHA '$actualSha' does not match requested '$requestedSha'."
          }
          $dirty = @(git status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -gt 0) {
            throw "Qualified builds require a clean tracked checkout."
          }
          git fetch origin master --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch origin/master." }
          git merge-base --is-ancestor $requestedSha origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Qualified signing builds must use a source SHA already contained in origin/master."
          }
          $buildId = Get-InputEnhancementBuildId -BuildNumber ([int]$env:REQUESTED_BUILD_NUMBER) -SourceSha $requestedSha
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          .\scripts\windows\tests\Test-InputEnhancementReleaseTools.ps1

      - name: Require Azure Artifact Signing configuration
        shell: powershell
        env:
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: .\scripts\windows\assert-input-enhancement-signing-config.ps1

      - name: Install Windows installer tooling
        uses: ./.github/actions/setup-windows-installer-tooling
        with:
          wixsharp-version: '1.19.0.0'

      - name: Download the exact unsigned build from the measured quality run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:QUALITY_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'quality_run_id must identify one completed Actions run.'
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALITY_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$run.head_sha -cne $env:REQUESTED_SOURCE_SHA -or
              [string]$run.conclusion -cne 'success' -or
              -not ([string]$run.path).EndsWith('/input-enhancement-quality.yml', [System.StringComparison]::Ordinal)) {
            throw 'Quality run must be a successful Input Enhancement Quality run for the exact requested SHA.'
          }
          New-Item -ItemType Directory -Force -Path .\build-shared-webengine | Out-Null
          $artifactName = "input-enhancement-unsigned-$env:REQUESTED_SOURCE_SHA-$env:QUALITY_RUN_ID"
          gh run download $env:QUALITY_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name $artifactName --dir .\build-shared-webengine
          if ($LASTEXITCODE -ne 0) { throw "The quality run has no exact unsigned build artifact '$artifactName'." }

          $metadata = Get-Content .\build-shared-webengine\unsigned-build-metadata.json -Raw | ConvertFrom-Json
          $binary = Get-Item .\build-shared-webengine\shared-webengine-stage\mumble.exe
          $binaryHash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([int]$metadata.schemaVersion -ne 1 -or
              [string]$metadata.sourceSha -cne $env:REQUESTED_SOURCE_SHA -or
              [int]$metadata.buildNumber -ne [int]$env:REQUESTED_BUILD_NUMBER -or
              [string]$metadata.testedBinarySha256 -cne $binaryHash) {
            throw 'Unsigned build metadata does not match the requested source, build number, or exact client bytes.'
          }

      - name: Revalidate mandatory release test gates from that build
        shell: powershell
        run: |
          Import-Module .\scripts\windows\InputEnhancementReleaseTools.psm1 -Force
          $gates = Read-ReleaseJson -Path .\build-shared-webengine\input-enhancement-test-gates.json
          Assert-TestGateResults -GateResults $gates

      - name: Validate staged client and installer
        shell: powershell
        run: |
          $stage = '.\build-shared-webengine\shared-webengine-stage'
          foreach ($relative in @('mumble.exe', 'mumble-updater.exe', 'mumble-screen-helper.exe', 'zlib1.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $relative) -PathType Leaf)) {
              throw "Exact unsigned stage is missing '$relative'."
            }
          }
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 `
            -StageRoot $stage `
            -ModelManifestPath .\build-shared-webengine\unsigned-input-models.json `
            -RecipeManifestPath .\build-shared-webengine\unsigned-input-recipes.json

      - name: Bind protected measured quality to the exact unsigned staged binary
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:QUALITY_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "quality_run_id must identify one completed Actions run."
          }
          if ($env:NIGHTLY_QUALITY_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "nightly_quality_run_id must identify one completed Actions run."
          }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALITY_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$run.head_sha -cne $env:REQUESTED_SOURCE_SHA -or
              [string]$run.conclusion -cne 'success' -or
              -not ([string]$run.path).EndsWith('/input-enhancement-quality.yml', [System.StringComparison]::Ordinal)) {
            throw "Quality run must be a successful Input Enhancement Quality run for the exact requested SHA."
          }
          $nightlyRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NIGHTLY_QUALITY_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$nightlyRun.head_sha -cne $env:REQUESTED_SOURCE_SHA -or
              [string]$nightlyRun.conclusion -cne 'success' -or
              -not ([string]$nightlyRun.path).EndsWith('/input-enhancement-quality.yml', [System.StringComparison]::Ordinal)) {
            throw "Nightly run must be a successful Input Enhancement Quality run for the exact requested SHA."
          }

          $evidenceRoot = '.\build-shared-webengine\measured-evidence'
          $lowRoot = Join-Path $evidenceRoot 'download-low-performance'
          $mainstreamRoot = Join-Path $evidenceRoot 'download-mainstream'
          $lowNightlyRoot = Join-Path $evidenceRoot 'download-nightly-low-performance'
          $mainstreamNightlyRoot = Join-Path $evidenceRoot 'download-nightly-mainstream'
          New-Item -ItemType Directory -Force -Path $lowRoot, $mainstreamRoot, $lowNightlyRoot, $mainstreamNightlyRoot | Out-Null
          gh run download $env:QUALITY_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name "input-enhancement-master_quality-low-performance-$env:REQUESTED_SOURCE_SHA" `
            --dir $lowRoot
          if ($LASTEXITCODE -ne 0) { throw "Low-performance measured evidence is missing." }
          gh run download $env:QUALITY_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name "input-enhancement-master_quality-mainstream-$env:REQUESTED_SOURCE_SHA" `
            --dir $mainstreamRoot
          if ($LASTEXITCODE -ne 0) { throw "Mainstream measured evidence is missing." }
          gh run download $env:NIGHTLY_QUALITY_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name "input-enhancement-nightly-low-performance-$env:REQUESTED_SOURCE_SHA" `
            --dir $lowNightlyRoot
          if ($LASTEXITCODE -ne 0) { throw "Low-performance nightly evidence is missing." }
          gh run download $env:NIGHTLY_QUALITY_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name "input-enhancement-nightly-mainstream-$env:REQUESTED_SOURCE_SHA" `
            --dir $mainstreamNightlyRoot
          if ($LASTEXITCODE -ne 0) { throw "Mainstream nightly evidence is missing." }

          Copy-Item (Join-Path $lowRoot 'qualification.json') `
            (Join-Path $evidenceRoot 'quality-master_quality-low-performance.json')
          Copy-Item (Join-Path $lowRoot 'original-voice-qualification.json') `
            (Join-Path $evidenceRoot 'original-voice-master_quality-low-performance.json')
          Copy-Item (Join-Path $mainstreamRoot 'qualification.json') `
            (Join-Path $evidenceRoot 'quality-master_quality-mainstream.json')
          Copy-Item (Join-Path $mainstreamRoot 'original-voice-qualification.json') `
            (Join-Path $evidenceRoot 'original-voice-master_quality-mainstream.json')
          Copy-Item (Join-Path $lowNightlyRoot 'qualification.json') `
            (Join-Path $evidenceRoot 'quality-nightly-low-performance.json')
          Copy-Item (Join-Path $lowNightlyRoot 'original-voice-qualification.json') `
            (Join-Path $evidenceRoot 'original-voice-nightly-low-performance.json')
          Copy-Item (Join-Path $mainstreamNightlyRoot 'qualification.json') `
            (Join-Path $evidenceRoot 'quality-nightly-mainstream.json')
          Copy-Item (Join-Path $mainstreamNightlyRoot 'original-voice-qualification.json') `
            (Join-Path $evidenceRoot 'original-voice-nightly-mainstream.json')

          $mergedArtifacts = Join-Path $evidenceRoot 'artifacts'
          New-Item -ItemType Directory -Force -Path $mergedArtifacts | Out-Null
          $artifactNamespaces = @(
            @{ Root = $lowRoot; Namespace = 'master_quality-low-performance' },
            @{ Root = $mainstreamRoot; Namespace = 'master_quality-mainstream' },
            @{ Root = $lowNightlyRoot; Namespace = 'nightly-low-performance' },
            @{ Root = $mainstreamNightlyRoot; Namespace = 'nightly-mainstream' }
          )
          foreach ($item in $artifactNamespaces) {
            $sourceArtifacts = Join-Path (Join-Path $item.Root 'artifacts') $item.Namespace
            $destinationArtifacts = Join-Path $mergedArtifacts $item.Namespace
            if (-not (Test-Path -LiteralPath $sourceArtifacts -PathType Container) -or
                (Test-Path -LiteralPath $destinationArtifacts)) {
              throw "Measured evidence artifact namespace '$($item.Namespace)' is missing or duplicated."
            }
            Copy-Item -LiteralPath $sourceArtifacts -Destination $destinationArtifacts -Recurse
          }

          .\scripts\windows\new-input-enhancement-measured-attestation.ps1 `
            -SourceRoot . `
            -SourceSha $env:REQUESTED_SOURCE_SHA `
            -TestedBinaryPath .\build-shared-webengine\shared-webengine-stage\mumble.exe `
            -LowPerformanceEvidenceRoot $lowRoot `
            -MainstreamEvidenceRoot $mainstreamRoot `
            -LowPerformanceNightlyEvidenceRoot $lowNightlyRoot `
            -MainstreamNightlyEvidenceRoot $mainstreamNightlyRoot `
            -UnsignedModelManifestPath .\build-shared-webengine\unsigned-input-models.json `
            -UnsignedRecipeManifestPath .\build-shared-webengine\unsigned-input-recipes.json `
            -QualityWorkflowRunId $env:QUALITY_RUN_ID `
            -NightlyQualityWorkflowRunId $env:NIGHTLY_QUALITY_RUN_ID `
            -ExpectedHarnessSha256 $env:INPUT_ENHANCEMENT_QUALITY_HARNESS_SHA256 `
            -OutputPath (Join-Path $evidenceRoot 'measured-quality-attestation.json')

      - name: Authenticate to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign staged PE payload with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\build-shared-webengine\shared-webengine-stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # These manifests hash model/runtime assets, including PE files. They
      # must be generated only after Authenticode has produced the immutable
      # PE bytes that are packaged into the MSI and update archive.
      - name: Generate and sign post-Authenticode model and recipe manifests
        shell: powershell
        env:
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          $stageRoot = '.\build-shared-webengine\shared-webengine-stage'
          .\scripts\windows\new-input-enhancement-package-manifests.ps1 `
            -StageRoot $stageRoot `
            -ModelDescriptorPath .\src\mumble\input-enhancement\input-models.descriptor.json `
            -RecipeDescriptorPath .\src\mumble\input-enhancement\input-recipes.descriptor.json
          $required = @(
            (Join-Path $stageRoot 'input-models.json'),
            (Join-Path $stageRoot 'input-recipes.json')
          )
          foreach ($path in $required) {
            Get-Content -LiteralPath $path -Raw | ConvertFrom-Json | Out-Null
            .\scripts\windows\protect-input-enhancement-json.ps1 `
              -InputPath $path `
              -SignaturePath "$path.sig" `
              -PrivateKeyBase64 $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 `
              -ExpectedPublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          }
          # Re-hash the actual post-signing assets and then verify the detached
          # signatures before any MSI/update packaging consumes this stage.
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 -StageRoot $stageRoot
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot $stageRoot `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\new-windows-runtime-manifest.ps1 -StageRoot $stageRoot

      - name: Rebuild MSI from the signed staged payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = '.\build-shared-webengine\qualified-bundle'
          Remove-Item -LiteralPath $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $bundleRoot 'installer'), `
            (Join-Path $bundleRoot 'metadata') | Out-Null
          .\scripts\windows\new-signed-input-enhancement-msi.ps1 `
            -RepoRoot . `
            -BuildRoot .\build-shared-webengine `
            -StageRoot .\build-shared-webengine\shared-webengine-stage `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath (Join-Path $bundleRoot "installer\mumble-forked-1.7.$env:REQUESTED_BUILD_NUMBER.msi") `
            -PayloadSignatureResultsPath (Join-Path $bundleRoot 'metadata\installer-payload-signatures.json')

      - name: Sign staged MSI with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\build-shared-webengine\qualified-bundle\installer
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed MSI container and administrative payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = '.\build-shared-webengine\qualified-bundle'
          $installerRoot = Join-Path $bundleRoot 'installer'
          $installerPath = Join-Path $installerRoot "mumble-forked-1.7.$env:REQUESTED_BUILD_NUMBER.msi"
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root $installerRoot `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath (Join-Path $bundleRoot 'metadata\installer-container-signature.json')
          .\scripts\windows\assert-input-enhancement-msi-payload.ps1 `
            -MsiPath $installerPath `
            -QualifiedPayloadRoot .\build-shared-webengine\shared-webengine-stage `
            -OutputPath (Join-Path $bundleRoot 'metadata\msi-payload-verification.json')

      - name: Assemble exact signed artifact and qualification
        shell: powershell
        env:
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $buildRoot = '.\build-shared-webengine'
          $stageRoot = Join-Path $buildRoot 'shared-webengine-stage'
          $bundleRoot = Join-Path $buildRoot 'qualified-bundle'
          $appRoot = Join-Path $bundleRoot 'app'
          $handoffRoot = Join-Path $buildRoot 'qualified-handoff'
          New-Item -ItemType Directory -Force -Path $appRoot, $handoffRoot | Out-Null
          Copy-Item -Path (Join-Path $stageRoot '*') -Destination $appRoot -Recurse -Force

          $updateName = "mumble-forked-1.7.$env:REQUESTED_BUILD_NUMBER.mumble-update"
          $updatePackagePath = Join-Path $bundleRoot $updateName
          .\scripts\windows\create-windows-update-package.ps1 `
            -StageRoot $stageRoot `
            -OutputPath $updatePackagePath `
            -Version "1.7.$env:REQUESTED_BUILD_NUMBER" `
            -Build ([int]$env:REQUESTED_BUILD_NUMBER) `
            -Commit $env:REQUESTED_SOURCE_SHA `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -Validate

          $updateVerificationRoot = Join-Path $buildRoot 'qualified-update-expanded'
          .\scripts\windows\assert-windows-update-package.ps1 `
            -PackagePath $updatePackagePath `
            -ExpectedCommit $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuild ([int]$env:REQUESTED_BUILD_NUMBER) `
            -ExpectedVersion "1.7.$env:REQUESTED_BUILD_NUMBER" `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -ExpandedPayloadPath $updateVerificationRoot
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot $updateVerificationRoot `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root $updateVerificationRoot `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath (Join-Path $bundleRoot 'metadata\update-payload-signatures.json')

          $signingResults = Join-Path $handoffRoot 'signing-results.json'
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root $bundleRoot `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath $signingResults

          $artifactPath = Join-Path $handoffRoot "mumble-input-enhancement-qualified-$env:BUILD_ID.zip"
          Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath $artifactPath -CompressionLevel Optimal
          $installerName = "mumble-forked-1.7.$env:REQUESTED_BUILD_NUMBER.msi"
          $installerPath = Join-Path $handoffRoot $installerName
          Copy-Item -LiteralPath (Join-Path $bundleRoot "installer\$installerName") -Destination $installerPath
          $modelManifest = Join-Path $stageRoot 'input-models.json'
          $recipeManifest = Join-Path $stageRoot 'input-recipes.json'
          Copy-Item -LiteralPath $modelManifest -Destination (Join-Path $handoffRoot 'input-models.json')
          Copy-Item -LiteralPath $recipeManifest -Destination (Join-Path $handoffRoot 'input-recipes.json')
          Copy-Item -LiteralPath "$modelManifest.sig" -Destination (Join-Path $handoffRoot 'input-models.json.sig')
          Copy-Item -LiteralPath "$recipeManifest.sig" -Destination (Join-Path $handoffRoot 'input-recipes.json.sig')
          Copy-Item -LiteralPath (Join-Path $buildRoot 'unsigned-input-models.json') `
            -Destination (Join-Path $handoffRoot 'unsigned-input-models.json')
          Copy-Item -LiteralPath (Join-Path $buildRoot 'unsigned-input-recipes.json') `
            -Destination (Join-Path $handoffRoot 'unsigned-input-recipes.json')
          Copy-Item -LiteralPath (Join-Path $buildRoot 'input-enhancement-test-gates.json') `
            -Destination (Join-Path $handoffRoot 'test-gates.json')
          Copy-Item -LiteralPath (Join-Path $bundleRoot 'metadata\msi-payload-verification.json') `
            -Destination (Join-Path $handoffRoot 'msi-payload-verification.json')
          $qualifiedUpdatePackage = Join-Path $handoffRoot $updateName
          Copy-Item -LiteralPath $updatePackagePath -Destination $qualifiedUpdatePackage
          $measuredRoot = Join-Path $buildRoot 'measured-evidence'
          foreach ($name in @(
            'measured-quality-attestation.json',
            'quality-master_quality-low-performance.json',
            'original-voice-master_quality-low-performance.json',
            'quality-master_quality-mainstream.json',
            'original-voice-master_quality-mainstream.json',
            'quality-nightly-low-performance.json',
            'original-voice-nightly-low-performance.json',
            'quality-nightly-mainstream.json',
            'original-voice-nightly-mainstream.json'
          )) {
            Copy-Item -LiteralPath (Join-Path $measuredRoot $name) -Destination (Join-Path $handoffRoot $name)
          }
          Copy-Item -LiteralPath (Join-Path $measuredRoot 'artifacts') `
            -Destination (Join-Path $handoffRoot 'artifacts') -Recurse

          .\scripts\windows\new-input-enhancement-qualification.ps1 `
            -SourceRoot . `
            -SourceSha $env:REQUESTED_SOURCE_SHA `
            -BuildNumber ([int]$env:REQUESTED_BUILD_NUMBER) `
            -ArtifactPath $artifactPath `
            -InstallerPath $installerPath `
            -MsiPayloadVerificationPath (Join-Path $handoffRoot 'msi-payload-verification.json') `
            -UpdatePackagePath $qualifiedUpdatePackage `
            -ModelManifestPath (Join-Path $handoffRoot 'input-models.json') `
            -RecipeManifestPath (Join-Path $handoffRoot 'input-recipes.json') `
            -UnsignedModelManifestPath (Join-Path $handoffRoot 'unsigned-input-models.json') `
            -UnsignedRecipeManifestPath (Join-Path $handoffRoot 'unsigned-input-recipes.json') `
            -ModelManifestSignaturePath (Join-Path $handoffRoot 'input-models.json.sig') `
            -RecipeManifestSignaturePath (Join-Path $handoffRoot 'input-recipes.json.sig') `
            -Ed25519PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -TestGateResultsPath (Join-Path $handoffRoot 'test-gates.json') `
            -SigningResultsPath $signingResults `
            -MeasuredEvidencePath (Join-Path $handoffRoot 'measured-quality-attestation.json') `
            -AllowedUntrackedRoots @('build-shared-webengine', 'build_env', '.cache', '.tmp') `
            -OutputPath (Join-Path $handoffRoot 'qualification.json')

          .\scripts\windows\assert-input-enhancement-qualification.ps1 `
            -QualificationPath (Join-Path $handoffRoot 'qualification.json') `
            -ArtifactPath $artifactPath `
            -InstallerPath $installerPath `
            -MsiPayloadVerificationPath (Join-Path $handoffRoot 'msi-payload-verification.json') `
            -UpdatePackagePath $qualifiedUpdatePackage `
            -ModelManifestPath (Join-Path $handoffRoot 'input-models.json') `
            -RecipeManifestPath (Join-Path $handoffRoot 'input-recipes.json') `
            -UnsignedModelManifestPath (Join-Path $handoffRoot 'unsigned-input-models.json') `
            -UnsignedRecipeManifestPath (Join-Path $handoffRoot 'unsigned-input-recipes.json') `
            -ModelManifestSignaturePath (Join-Path $handoffRoot 'input-models.json.sig') `
            -RecipeManifestSignaturePath (Join-Path $handoffRoot 'input-recipes.json.sig') `
            -ExpectedEd25519PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -TestGateResultsPath (Join-Path $handoffRoot 'test-gates.json') `
            -SigningResultsPath $signingResults `
            -MeasuredEvidencePath (Join-Path $handoffRoot 'measured-quality-attestation.json') `
            -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuildId $env:BUILD_ID `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT
          .\scripts\windows\protect-input-enhancement-json.ps1 `
            -InputPath (Join-Path $handoffRoot 'qualification.json') `
            -SignaturePath (Join-Path $handoffRoot 'qualification.json.sig') `
            -PrivateKeyBase64 $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 `
            -ExpectedPublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX

      - name: Transfer qualified files to immutable publisher
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: input-enhancement-qualified-${{ steps.metadata.outputs.build_id }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: build-shared-webengine/qualified-handoff/*

  release-smoke:
    name: release-smoke-exact-signed-artifact
    needs: build-test-sign
    runs-on:
      - self-hosted
      - windows
      - x64
      - input-enhancement-mainstream
    environment: release-preview
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # Protected repository variable. It must be an absolute path to a runner-local
      # PowerShell harness outside GITHUB_WORKSPACE. Harness contract:
      # - accept the named arguments used below;
      # - run the fixed input-enhancement-release-smoke-v1 matrix (6 Original controls + 24 enhanced cases);
      # - use only ExpandedArtifactRoot/mumble.exe from the verified update payload for both clients;
      # - route client 1 through an OG Mumble Opus server on 127.0.0.1 to client 2;
      # - keep receiver/post-decode cleanup disabled;
      # - attest the qualified RNNoise/DeepFilterNet model IDs and exact manifest hashes;
      # - hash the protected harness, fixture manifest, fixed case set, and OG server binary;
      # - emit six explicit Original controls and bind every enhanced case to the exact
      #   fixture, control artifact, packaged clients, server, harness, and zero deadline misses;
      # - leave only the audio-free OutputPath JSON and no audio in EvidenceRoot.
      RELEASE_SMOKE_HARNESS: ${{ vars.INPUT_ENHANCEMENT_RELEASE_SMOKE_HARNESS }}
      RELEASE_SMOKE_FIXTURE_MANIFEST: ${{ vars.INPUT_ENHANCEMENT_RELEASE_SMOKE_FIXTURE_MANIFEST }}
      RELEASE_SMOKE_CASE_SET: ${{ vars.INPUT_ENHANCEMENT_RELEASE_SMOKE_CASE_SET }}
      RELEASE_SMOKE_SERVER_BINARY: ${{ vars.INPUT_ENHANCEMENT_RELEASE_SMOKE_SERVER_BINARY }}
      AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
      INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      BUILD_ID: ${{ needs.build-test-sign.outputs.build_id }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Require protected runner-local release-smoke harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Release smoke is restricted to the protected master workflow ref.'
          }
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
          $protectedInputs = @(
            @{ Name = 'harness'; Variable = 'RELEASE_SMOKE_HARNESS'; Extension = '.ps1'; HashVariable = 'RELEASE_SMOKE_HARNESS_SHA256' },
            @{ Name = 'fixture manifest'; Variable = 'RELEASE_SMOKE_FIXTURE_MANIFEST'; Extension = '.json'; HashVariable = 'RELEASE_SMOKE_FIXTURE_MANIFEST_SHA256' },
            @{ Name = 'case set'; Variable = 'RELEASE_SMOKE_CASE_SET'; Extension = '.json'; HashVariable = 'RELEASE_SMOKE_CASE_SET_SHA256' },
            @{ Name = 'OG server binary'; Variable = 'RELEASE_SMOKE_SERVER_BINARY'; Extension = '.exe'; HashVariable = 'RELEASE_SMOKE_SERVER_BINARY_SHA256' }
          )
          foreach ($input in $protectedInputs) {
            $path = [Environment]::GetEnvironmentVariable([string]$input.Variable)
            if ([string]::IsNullOrWhiteSpace($path) -or -not [System.IO.Path]::IsPathFullyQualified($path)) {
              throw "Protected release-smoke $($input.Name) must be configured as an absolute runner-local path."
            }
            $item = Get-Item -LiteralPath $path -ErrorAction Stop
            if ($item.PSIsContainer -or $item.Extension -cne [string]$input.Extension) {
              throw "Protected release-smoke $($input.Name) must identify a $($input.Extension) file."
            }
            $fullPath = [System.IO.Path]::GetFullPath($item.FullName)
            if ($fullPath.StartsWith($workspace, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Protected release-smoke $($input.Name) must live outside the checked-out repository."
            }
            $hash = (Get-FileHash -LiteralPath $fullPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$($input.HashVariable)=$hash" >> $env:GITHUB_ENV
          }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT)) {
            throw 'Protected release-preview environment is missing AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT.'
          }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: input-enhancement-qualified-${{ needs.build-test-sign.outputs.build_id }}
          path: qualified-handoff

      - name: Reverify and expand exact qualified artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath .\qualified-handoff\qualification.json `
            -SignaturePath .\qualified-handoff\qualification.json.sig `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $qualification = Get-Content .\qualified-handoff\qualification.json -Raw | ConvertFrom-Json
          $artifactPath = Join-Path '.\qualified-handoff' ([string]$qualification.artifact.fileName)
          $installerPath = Join-Path '.\qualified-handoff' ([string]$qualification.installer.fileName)
          $updatePackagePath = Join-Path '.\qualified-handoff' ([string]$qualification.updatePackage.fileName)
          .\scripts\windows\assert-input-enhancement-qualification.ps1 `
            -QualificationPath .\qualified-handoff\qualification.json `
            -ArtifactPath $artifactPath `
            -InstallerPath $installerPath `
            -MsiPayloadVerificationPath .\qualified-handoff\msi-payload-verification.json `
            -UpdatePackagePath $updatePackagePath `
            -ModelManifestPath .\qualified-handoff\input-models.json `
            -RecipeManifestPath .\qualified-handoff\input-recipes.json `
            -UnsignedModelManifestPath .\qualified-handoff\unsigned-input-models.json `
            -UnsignedRecipeManifestPath .\qualified-handoff\unsigned-input-recipes.json `
            -ModelManifestSignaturePath .\qualified-handoff\input-models.json.sig `
            -RecipeManifestSignaturePath .\qualified-handoff\input-recipes.json.sig `
            -ExpectedEd25519PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -TestGateResultsPath .\qualified-handoff\test-gates.json `
            -SigningResultsPath .\qualified-handoff\signing-results.json `
            -MeasuredEvidencePath .\qualified-handoff\measured-quality-attestation.json `
            -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuildId $env:BUILD_ID `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT

          $expandedRoot = Join-Path $env:RUNNER_TEMP "mumble-qualified-release-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item -LiteralPath $expandedRoot -Recurse -Force -ErrorAction SilentlyContinue
          .\scripts\windows\assert-windows-update-package.ps1 `
            -PackagePath $updatePackagePath `
            -ExpectedCommit $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuild ([int]$env:REQUESTED_BUILD_NUMBER) `
            -ExpectedVersion "1.7.$env:REQUESTED_BUILD_NUMBER" `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -ExpandedPayloadPath $expandedRoot
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 `
            -StageRoot $expandedRoot
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot $expandedRoot `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root $expandedRoot `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'release-smoke-signature-verification.json')
          "RELEASE_SMOKE_ARTIFACT=$([System.IO.Path]::GetFullPath($updatePackagePath))" >> $env:GITHUB_ENV
          "RELEASE_SMOKE_EXPANDED_ROOT=$expandedRoot" >> $env:GITHUB_ENV

      - name: Run fixed packaged client-server-client release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $harness = (Get-Item -LiteralPath $env:RELEASE_SMOKE_HARNESS -ErrorAction Stop).FullName
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "mumble-release-smoke-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $workRoot = Join-Path $env:RUNNER_TEMP "mumble-release-smoke-work-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item -LiteralPath $evidenceRoot, $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $evidenceRoot, $workRoot | Out-Null
          $outputPath = Join-Path $evidenceRoot 'release-smoke.json'
          try {
            & $harness `
              -Suite 'input-enhancement-release-smoke-v1' `
              -ExpandedArtifactRoot $env:RELEASE_SMOKE_EXPANDED_ROOT `
              -ArtifactPath $env:RELEASE_SMOKE_ARTIFACT `
              -QualificationPath (Join-Path $env:GITHUB_WORKSPACE 'qualified-handoff\qualification.json') `
              -ModelManifestPath (Join-Path $env:GITHUB_WORKSPACE 'qualified-handoff\input-models.json') `
              -RecipeManifestPath (Join-Path $env:GITHUB_WORKSPACE 'qualified-handoff\input-recipes.json') `
              -FixtureManifestPath $env:RELEASE_SMOKE_FIXTURE_MANIFEST `
              -CaseSetPath $env:RELEASE_SMOKE_CASE_SET `
              -ServerExecutablePath $env:RELEASE_SMOKE_SERVER_BINARY `
              -ExpectedHarnessSha256 $env:RELEASE_SMOKE_HARNESS_SHA256 `
              -WorkRoot $workRoot `
              -OutputPath $outputPath `
              -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
              -ExpectedBuildId $env:BUILD_ID
            if (-not $?) {
              throw 'Runner-local release-smoke harness returned failure.'
            }
          } finally {
            Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          .\scripts\windows\assert-input-enhancement-release-smoke.ps1 `
            -ReleaseSmokePath $outputPath `
            -QualificationPath .\qualified-handoff\qualification.json `
            -ModelManifestPath .\qualified-handoff\input-models.json `
            -RecipeManifestPath .\qualified-handoff\input-recipes.json `
            -ModelManifestSignaturePath .\qualified-handoff\input-models.json.sig `
            -RecipeManifestSignaturePath .\qualified-handoff\input-recipes.json.sig `
            -ArtifactPath $env:RELEASE_SMOKE_ARTIFACT `
            -ExpandedArtifactRoot $env:RELEASE_SMOKE_EXPANDED_ROOT `
            -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuildId $env:BUILD_ID `
            -ExpectedHarnessSha256 $env:RELEASE_SMOKE_HARNESS_SHA256 `
            -FixtureManifestPath $env:RELEASE_SMOKE_FIXTURE_MANIFEST `
            -CaseSetPath $env:RELEASE_SMOKE_CASE_SET `
            -ExpectedFixtureManifestSha256 $env:RELEASE_SMOKE_FIXTURE_MANIFEST_SHA256 `
            -ExpectedCaseSetSha256 $env:RELEASE_SMOKE_CASE_SET_SHA256 `
            -ExpectedServerExecutableSha256 $env:RELEASE_SMOKE_SERVER_BINARY_SHA256
          Copy-Item -LiteralPath $env:RELEASE_SMOKE_FIXTURE_MANIFEST `
            -Destination (Join-Path $evidenceRoot 'fixture-manifest.json')
          Copy-Item -LiteralPath $env:RELEASE_SMOKE_CASE_SET `
            -Destination (Join-Path $evidenceRoot 'case-set.json')
          $evidenceFiles = @(Get-ChildItem -LiteralPath $evidenceRoot -File -Recurse)
          $expectedEvidenceNames = @('case-set.json', 'fixture-manifest.json', 'release-smoke.json')
          if ($evidenceFiles.Count -ne 3 -or
              @($evidenceFiles.Name | Sort-Object) -join ',' -cne ($expectedEvidenceNames -join ',')) {
            throw 'Release-smoke evidence may contain only its audio-free attestation, fixture manifest, and case set.'
          }
          "RELEASE_SMOKE_EVIDENCE_ROOT=$evidenceRoot" >> $env:GITHUB_ENV

      - name: Transfer only audio-free release-smoke attestation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: input-enhancement-release-smoke-${{ needs.build-test-sign.outputs.build_id }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/mumble-release-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.json

  publish-immutable:
    name: publish-immutable
    needs:
      - build-test-sign
      - release-smoke
    runs-on: windows-2022
    environment: release-preview
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT: ${{ vars.AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT }}
      INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX: ${{ vars.INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: input-enhancement-qualified-${{ needs.build-test-sign.outputs.build_id }}
          path: qualified-handoff

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: input-enhancement-release-smoke-${{ needs.build-test-sign.outputs.build_id }}
          path: release-smoke-attestation

      - name: Reverify transferred artifact
        shell: powershell
        env:
          BUILD_ID: ${{ needs.build-test-sign.outputs.build_id }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\windows\assert-input-enhancement-detached-signature.ps1 `
            -InputPath .\qualified-handoff\qualification.json `
            -SignaturePath .\qualified-handoff\qualification.json.sig `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          $qualification = Get-Content .\qualified-handoff\qualification.json -Raw | ConvertFrom-Json
          $artifactPath = Join-Path '.\qualified-handoff' ([string]$qualification.artifact.fileName)
          $installerPath = Join-Path '.\qualified-handoff' ([string]$qualification.installer.fileName)
          $updatePackagePath = Join-Path '.\qualified-handoff' ([string]$qualification.updatePackage.fileName)
          .\scripts\windows\assert-input-enhancement-qualification.ps1 `
            -QualificationPath .\qualified-handoff\qualification.json `
            -ArtifactPath $artifactPath `
            -InstallerPath $installerPath `
            -MsiPayloadVerificationPath .\qualified-handoff\msi-payload-verification.json `
            -UpdatePackagePath $updatePackagePath `
            -ModelManifestPath .\qualified-handoff\input-models.json `
            -RecipeManifestPath .\qualified-handoff\input-recipes.json `
            -UnsignedModelManifestPath .\qualified-handoff\unsigned-input-models.json `
            -UnsignedRecipeManifestPath .\qualified-handoff\unsigned-input-recipes.json `
            -ModelManifestSignaturePath .\qualified-handoff\input-models.json.sig `
            -RecipeManifestSignaturePath .\qualified-handoff\input-recipes.json.sig `
            -ExpectedEd25519PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX `
            -TestGateResultsPath .\qualified-handoff\test-gates.json `
            -SigningResultsPath .\qualified-handoff\signing-results.json `
            -MeasuredEvidencePath .\qualified-handoff\measured-quality-attestation.json `
            -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuildId $env:BUILD_ID `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT
          Expand-Archive -LiteralPath $artifactPath -DestinationPath .\qualified-expanded
          .\scripts\windows\assert-input-enhancement-package-manifests.ps1 `
            -StageRoot .\qualified-expanded\app
          .\scripts\windows\assert-input-enhancement-package-signatures.ps1 `
            -StageRoot .\qualified-expanded\app `
            -PublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX
          .\scripts\windows\assert-input-enhancement-signatures.ps1 `
            -Root .\qualified-expanded `
            -ExpectedSignerSubject $env:AZURE_ARTIFACT_SIGNING_EXPECTED_SUBJECT `
            -OutputPath .\transferred-signing-results.json
          .\scripts\windows\assert-windows-update-package.ps1 `
            -PackagePath $updatePackagePath `
            -ExpectedCommit $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuild ([int]$env:REQUESTED_BUILD_NUMBER) `
            -ExpectedVersion "1.7.$env:REQUESTED_BUILD_NUMBER" `
            -RequireUpdaterRuntime `
            -RequireGStreamerRuntime `
            -ExpandedPayloadPath .\qualified-update-expanded
          $releaseSmoke = Get-Content .\release-smoke-attestation\release-smoke.json -Raw | ConvertFrom-Json
          .\scripts\windows\assert-input-enhancement-release-smoke.ps1 `
            -ReleaseSmokePath .\release-smoke-attestation\release-smoke.json `
            -QualificationPath .\qualified-handoff\qualification.json `
            -ModelManifestPath .\qualified-handoff\input-models.json `
            -RecipeManifestPath .\qualified-handoff\input-recipes.json `
            -ModelManifestSignaturePath .\qualified-handoff\input-models.json.sig `
            -RecipeManifestSignaturePath .\qualified-handoff\input-recipes.json.sig `
            -ArtifactPath $updatePackagePath `
            -ExpandedArtifactRoot .\qualified-update-expanded `
            -ExpectedSourceSha $env:REQUESTED_SOURCE_SHA `
            -ExpectedBuildId $env:BUILD_ID `
            -ExpectedHarnessSha256 ([string]$releaseSmoke.provenance.harnessSha256) `
            -FixtureManifestPath .\release-smoke-attestation\fixture-manifest.json `
            -CaseSetPath .\release-smoke-attestation\case-set.json `
            -ExpectedFixtureManifestSha256 ([string]$releaseSmoke.provenance.fixtureManifestSha256) `
            -ExpectedCaseSetSha256 ([string]$releaseSmoke.provenance.caseSetSha256) `
            -ExpectedServerExecutableSha256 ([string]$releaseSmoke.provenance.serverExecutableSha256)
          Copy-Item -LiteralPath .\release-smoke-attestation\release-smoke.json `
            -Destination .\qualified-handoff\release-smoke.json
          Copy-Item -LiteralPath .\release-smoke-attestation\fixture-manifest.json `
            -Destination .\qualified-handoff\release-smoke-fixture-manifest.json
          Copy-Item -LiteralPath .\release-smoke-attestation\case-set.json `
            -Destination .\qualified-handoff\release-smoke-case-set.json

      - name: Sign verified release-smoke attestation
        shell: powershell
        env:
          INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\protect-input-enhancement-json.ps1 `
            -InputPath .\qualified-handoff\release-smoke.json `
            -SignaturePath .\qualified-handoff\release-smoke.json.sig `
            -PrivateKeyBase64 $env:INPUT_ENHANCEMENT_ED25519_PRIVATE_KEY_BASE64 `
            -ExpectedPublicKeyHex $env:INPUT_ENHANCEMENT_ED25519_PUBLIC_KEY_HEX

      - name: Publish immutable qualified release
        shell: powershell
        env:
          BUILD_ID: ${{ needs.build-test-sign.outputs.build_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:BUILD_ID
          $sourceSha = $env:REQUESTED_SOURCE_SHA.ToLowerInvariant()
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Immutable release '$tag' already exists and will not be replaced."
          }

          $sameBuildTags = @(git ls-remote origin "refs/tags/mumble-forked-build-$env:REQUESTED_BUILD_NUMBER-*")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify immutable build-number uniqueness."
          }
          $conflictingTags = @($sameBuildTags | Where-Object {
            ([string]$_ -split '\s+')[1] -cne "refs/tags/$tag"
          })
          if ($conflictingTags.Count -gt 0) {
            throw "Build number '$env:REQUESTED_BUILD_NUMBER' is already bound to another immutable source and cannot be reused."
          }

          $remoteTag = @(git ls-remote origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect remote tag '$tag'."
          }
          if ($remoteTag.Count -gt 0) {
            $remoteSha = ([string]$remoteTag[0] -split '\s+')[0].ToLowerInvariant()
            if ($remoteSha -cne $sourceSha) {
              throw "Immutable tag '$tag' already points to unexpected SHA '$remoteSha'."
            }
          } else {
            git tag $tag $sourceSha
            if ($LASTEXITCODE -ne 0) { throw "Unable to create immutable tag '$tag'." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Unable to push immutable tag '$tag'." }
          }

          $notes = @(
            "# Qualified input-enhancement build",
            "",
            "This immutable release contains the exact signed artifact that passed the mandatory input-enhancement runtime, Auto, calibration, settings, cleanup, benchmark, and packaged 30-case localhost release-smoke gates (6 Original controls + 24 enhanced cases).",
            "",
            "- Build ID: $tag",
            "- Source: $sourceSha",
            "- Promotion status: not yet pointed to by preview or stable"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $notes += ""
            $notes += $env:RELEASE_NOTES.Trim()
          }
          [System.IO.File]::WriteAllLines('.\qualified-release-notes.md', $notes, [System.Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem .\qualified-handoff -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --title $tag `
            --notes-file .\qualified-release-notes.md
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish immutable qualified release '$tag'."
          }
