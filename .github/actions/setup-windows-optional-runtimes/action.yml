name: 'Setup Windows Optional Runtimes'
description: 'Restore and install optional Windows runtime and toolchain dependencies used by CI builds.'
author: 'Mumble Developers'

inputs:
  onnxruntime-version:
    description: 'ONNX Runtime version to restore or download.'
    required: true
  install-rust:
    description: 'Install the Rust toolchain for DeepFilterNet.'
    required: false
    default: 'true'
  install-ffmpeg:
    description: 'Install ffmpeg and ffplay for screen-share helper runtime checks.'
    required: false
    default: 'false'
  install-gstreamer:
    description: 'Install the GStreamer MSVC runtime for native screen-share publishing and viewing.'
    required: false
    default: 'false'
  gstreamer-version:
    description: 'GStreamer MSVC runtime version to restore or download.'
    required: false
    default: '1.26.7'
  rnnoise-model-url:
    description: 'Optional primary RNNoise model archive URL.'
    required: false
    default: ''
  rnnoise-model-release-tag:
    description: 'Optional GitHub release tag in the current repository that mirrors the RNNoise model archive.'
    required: false
    default: ''

outputs:
  rnnoise-model-cache-hit:
    description: 'Whether the RNNoise model archive cache was restored.'
    value: ${{ steps.restore-rnnoise-model-cache.outputs.cache-hit }}
  rnnoise-model-cache-key:
    description: 'Cache key for the RNNoise model archive.'
    value: ${{ steps.rnnoise-model-metadata.outputs.cache-key }}
  rnnoise-model-cache-path:
    description: 'Cache path for the RNNoise model archive.'
    value: ${{ steps.rnnoise-model-metadata.outputs.cache-path }}
  onnxruntime-cache-hit:
    description: 'Whether the ONNX Runtime cache was restored.'
    value: ${{ steps.restore-onnxruntime-cache.outputs.cache-hit }}
  gstreamer-cache-hit:
    description: 'Whether the GStreamer runtime cache was restored.'
    value: ${{ steps.restore-gstreamer-cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Install vcvars-bash for MSVC setup
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f "C:/vcvars-bash/vcvarsall.sh" ]]; then
          rm -rf "C:/vcvars-bash"
          git -c protocol.version=2 -c http.version=HTTP/1.1 clone --depth 1 \
            https://github.com/nathan818fr/vcvars-bash.git "C:/vcvars-bash"
        fi

    - id: rnnoise-model-metadata
      name: Resolve RNNoise model archive
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $modelVersionPath = Join-Path $env:GITHUB_WORKSPACE "3rdparty\rnnoise-src\model_version"
        if (-not (Test-Path -LiteralPath $modelVersionPath)) {
          throw "Unable to locate RNNoise model version file at '$modelVersionPath'."
        }

        $hash = (Get-Content -LiteralPath $modelVersionPath -Raw).Trim().ToLowerInvariant()
        if ($hash -notmatch '^[0-9a-f]{64}$') {
          throw "RNNoise model version '$hash' is not a SHA-256 hash."
        }

        $cacheRootRelative = ".cache/rnnoise-model/$hash"
        $cacheRoot = Join-Path $env:GITHUB_WORKSPACE ".cache\rnnoise-model\$hash"
        $archiveName = "rnnoise_data-$hash.tar.gz"
        $archivePath = Join-Path $cacheRoot $archiveName
        $runnerOs = if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { "Windows" } else { $env:RUNNER_OS }
        $cacheKey = "rnnoise-model-$runnerOs-$hash"

        "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "archive-name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "archive-path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cache-key=$cacheKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cache-path=$cacheRootRelative" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - id: restore-rnnoise-model-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.rnnoise-model-metadata.outputs.cache-path }}
        key: ${{ steps.rnnoise-model-metadata.outputs.cache-key }}

    - name: Download RNNoise model archive
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"

        $hash = "${{ steps.rnnoise-model-metadata.outputs.hash }}"
        $archivePath = "${{ steps.rnnoise-model-metadata.outputs.archive-path }}"
        $archiveName = "${{ steps.rnnoise-model-metadata.outputs.archive-name }}"
        $cacheRoot = Split-Path -Parent $archivePath
        $tempArchive = Join-Path $env:RUNNER_TEMP "$archiveName.download"
        $archiveUrls = New-Object System.Collections.Generic.List[string]

        function Add-ArchiveUrl {
          param(
            [string]$Url
          )

          $normalizedUrl = ([string]$Url).Trim()
          if (-not [string]::IsNullOrWhiteSpace($normalizedUrl) -and -not $archiveUrls.Contains($normalizedUrl)) {
            $archiveUrls.Add($normalizedUrl) | Out-Null
          }
        }

        Add-ArchiveUrl "${{ inputs.rnnoise-model-url }}"
        Add-ArchiveUrl ([System.Environment]::GetEnvironmentVariable("MUMBLE_RNNOISE_MODEL_ARCHIVE_URL", "Process"))

        $releaseTag = "${{ inputs.rnnoise-model-release-tag }}".Trim()
        if ([string]::IsNullOrWhiteSpace($releaseTag)) {
          $releaseTag = [System.Environment]::GetEnvironmentVariable("MUMBLE_RNNOISE_MODEL_RELEASE_TAG", "Process")
        }
        $repository = [System.Environment]::GetEnvironmentVariable("GITHUB_REPOSITORY", "Process")
        if (-not [string]::IsNullOrWhiteSpace($releaseTag) -and -not [string]::IsNullOrWhiteSpace($repository)) {
          Add-ArchiveUrl "https://github.com/$repository/releases/download/$releaseTag/$archiveName"
        }

        $environmentSource = [System.Environment]::GetEnvironmentVariable("MUMBLE_ENVIRONMENT_SOURCE", "Process")
        if (-not [string]::IsNullOrWhiteSpace($environmentSource)) {
          Add-ArchiveUrl "$(([string]$environmentSource).TrimEnd('/'))/$archiveName"
        }

        Add-ArchiveUrl "https://media.xiph.org/rnnoise/models/$archiveName"

        function Get-FileSha256 {
          param(
            [Parameter(Mandatory = $true)]
            [string]$Path
          )

          return (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
        }

        function Test-ArchiveHash {
          param(
            [Parameter(Mandatory = $true)]
            [string]$Path,

            [Parameter(Mandatory = $true)]
            [string]$ExpectedHash
          )

          if (-not (Test-Path -LiteralPath $Path)) {
            return $false
          }

          $actualHash = Get-FileSha256 -Path $Path
          if ($actualHash -ne $ExpectedHash) {
            Write-Warning "RNNoise model archive hash mismatch at '$Path'. Expected $ExpectedHash but got $actualHash."
            return $false
          }

          return $true
        }

        if (-not (Test-ArchiveHash -Path $archivePath -ExpectedHash $hash)) {
          Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $tempArchive -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null

          foreach ($archiveUrl in $archiveUrls) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Write-Host "Downloading RNNoise model archive (attempt $attempt/4): $archiveUrl"
                Invoke-WebRequest -Uri $archiveUrl -OutFile $tempArchive -TimeoutSec 120
                if (-not (Test-ArchiveHash -Path $tempArchive -ExpectedHash $hash)) {
                  throw "Downloaded RNNoise model archive failed checksum validation."
                }
                Move-Item -LiteralPath $tempArchive -Destination $archivePath -Force
                break
              } catch {
                Remove-Item -LiteralPath $tempArchive -Force -ErrorAction SilentlyContinue

                $statusCode = $null
                if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                  $statusCode = [int]$_.Exception.Response.StatusCode
                }
                if ($statusCode -ge 400 -and $statusCode -lt 500 -and $statusCode -notin @(408, 429)) {
                  Write-Warning "RNNoise model URL returned HTTP $statusCode and will not be retried: $archiveUrl"
                  break
                }

                if ($attempt -eq 4) {
                  Write-Warning "RNNoise model download failed after $attempt attempts from '$archiveUrl': $($_.Exception.Message)"
                  break
                }

                $delaySeconds = [Math]::Min(60, 10 * $attempt)
                Write-Warning "RNNoise model download failed: $($_.Exception.Message). Retrying in $delaySeconds seconds."
                Start-Sleep -Seconds $delaySeconds
              }
            }

            if (Test-ArchiveHash -Path $archivePath -ExpectedHash $hash) {
              break
            }
          }
        }

        if (-not (Test-ArchiveHash -Path $archivePath -ExpectedHash $hash)) {
          throw "RNNoise model archive is unavailable or invalid after download: $archivePath"
        }

        Write-Host "Using RNNoise model archive: $archivePath"
        "MUMBLE_RNNOISE_MODEL_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "RNNOISE_MODEL_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - id: restore-onnxruntime-cache
      uses: actions/cache/restore@v5
      with:
        path: .cache/onnxruntime/win-x64-${{ inputs.onnxruntime-version }}
        key: onnxruntime-${{ runner.os }}-x64-${{ inputs.onnxruntime-version }}

    - name: Download ONNX Runtime for DTLN
      shell: powershell
      run: |
        $version = "${{ inputs.onnxruntime-version }}"
        $cacheRoot = Join-Path $env:GITHUB_WORKSPACE ".cache\onnxruntime\win-x64-$version"
        $archive = Join-Path $env:RUNNER_TEMP "onnxruntime-win-x64-$version.zip"
        $onnxRoot = Join-Path $cacheRoot "onnxruntime-win-x64-$version"
        if (-not (Test-Path -LiteralPath (Join-Path $onnxRoot "include"))) {
          if (Test-Path -LiteralPath $cacheRoot) {
            Remove-Item -LiteralPath $cacheRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $cacheRoot -Force
        }
        if (-not (Test-Path -LiteralPath (Join-Path $onnxRoot "include"))) {
          throw "Expanded ONNX Runtime archive is missing its include directory"
        }
        "ONNXRUNTIME_ROOT=$onnxRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - id: restore-gstreamer-cache
      if: ${{ inputs.install-gstreamer == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: .cache/gstreamer/msvc-x86_64-${{ inputs.gstreamer-version }}
        key: gstreamer-${{ runner.os }}-msvc-x86_64-${{ inputs.gstreamer-version }}

    - name: Install GStreamer runtime for screen sharing
      if: ${{ inputs.install-gstreamer == 'true' }}
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $version = "${{ inputs.gstreamer-version }}"
        $cacheRoot = Join-Path $env:GITHUB_WORKSPACE ".cache\gstreamer\msvc-x86_64-$version"
        $installRoot = Join-Path $cacheRoot "gstreamer\1.0\msvc_x86_64"
        $runtimeMsi = Join-Path $env:RUNNER_TEMP "gstreamer-1.0-msvc-x86_64-$version.msi"
        $installLog = Join-Path $env:RUNNER_TEMP "gstreamer-runtime-install.log"

        function Get-GStreamerRuntimeRoot {
          param(
            [Parameter(Mandatory = $true)]
            [string]$Root
          )

          $launcher = Get-ChildItem -Path $Root -Recurse -File -Filter "gst-launch-1.0.exe" -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName |
            Select-Object -First 1
          if (-not $launcher) {
            return ""
          }

          $binDir = Split-Path -Parent $launcher.FullName
          $runtimeRoot = Split-Path -Parent $binDir
          if ((Split-Path -Leaf $binDir) -ieq "bin") {
            return $runtimeRoot
          }

          return $binDir
        }

        function Test-GstElement {
          param(
            [Parameter(Mandatory = $true)]
            [string]$GstInspect,

            [Parameter(Mandatory = $true)]
            [string]$Element
          )

          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = "Continue"
            & $GstInspect $Element > $null 2>&1
            return ($LASTEXITCODE -eq 0)
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
        }

        $gstreamerRoot = Get-GStreamerRuntimeRoot -Root $cacheRoot
        if ([string]::IsNullOrWhiteSpace($gstreamerRoot)) {
          Remove-Item -LiteralPath $cacheRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null

          $runtimeUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.msi"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeMsi

          $arguments = @(
            "/i", $runtimeMsi,
            "/qn",
            "/norestart",
            "ADDLOCAL=ALL",
            "INSTALLDIR=$installRoot",
            "/L*v", $installLog
          )
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 80 | ForEach-Object { Write-Host $_ }
            }
            throw "GStreamer runtime installer failed with exit code $($process.ExitCode)."
          }

          $gstreamerRoot = Get-GStreamerRuntimeRoot -Root $cacheRoot
        }

        if ([string]::IsNullOrWhiteSpace($gstreamerRoot)) {
          throw "Unable to locate gst-launch-1.0.exe in the GStreamer cache."
        }

        $gstBin = Join-Path $gstreamerRoot "bin"
        $gstLaunch = Join-Path $gstBin "gst-launch-1.0.exe"
        $gstInspect = Join-Path $gstBin "gst-inspect-1.0.exe"
        $gstPluginPath = Join-Path $gstreamerRoot "lib\gstreamer-1.0"
        $gstScanner = Join-Path $gstreamerRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"

        foreach ($requiredPath in @($gstLaunch, $gstInspect, $gstPluginPath, $gstScanner)) {
          if (-not (Test-Path -LiteralPath $requiredPath)) {
            throw "GStreamer runtime is missing required path: $requiredPath"
          }
        }

        $env:PATH = "$gstBin;$env:PATH"
        $env:GST_PLUGIN_SYSTEM_PATH_1_0 = $gstPluginPath
        $env:GST_PLUGIN_PATH = $gstPluginPath
        $env:GST_PLUGIN_SCANNER = $gstScanner

        $requiredElements = @(
          "d3d11screencapturesrc",
          "d3d11convert",
          "d3d11scale",
          "d3d11download",
          "livekitwebrtcsink",
          "livekitwebrtcsrc",
          "h264parse",
          "decodebin",
          "videotestsrc",
          "videoconvert",
          "videoscale"
        )
        $missing = New-Object System.Collections.Generic.List[string]
        foreach ($element in $requiredElements) {
          if (-not (Test-GstElement -GstInspect $gstInspect -Element $element)) {
            $missing.Add($element)
          }
        }

        $encoderCandidates = @("nvd3d11h264enc", "mfh264enc", "x264enc", "openh264enc")
        $hasEncoder = $false
        foreach ($element in $encoderCandidates) {
          if (Test-GstElement -GstInspect $gstInspect -Element $element) {
            $hasEncoder = $true
            break
          }
        }
        if (-not $hasEncoder) {
          $missing.Add($encoderCandidates -join "|")
        }

        if ($missing.Count -gt 0) {
          throw "GStreamer runtime is missing required screen-share elements: $($missing -join ', ')"
        }

        & $gstLaunch --version
        "MUMBLE_GSTREAMER_ROOT=$gstreamerRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GSTREAMER_1_0_ROOT_X86_64=$gstreamerRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstreamerRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GSTREAMER_ROOT_X86_64=$gstreamerRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "MUMBLE_SCREENSHARE_GST_LAUNCH_PATH=$gstLaunch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "MUMBLE_SCREENSHARE_GST_INSPECT_PATH=$gstInspect" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GST_PLUGIN_SYSTEM_PATH_1_0=$gstPluginPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GST_PLUGIN_PATH=$gstPluginPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install Rust toolchain for DeepFilterNet
      if: ${{ inputs.install-rust == 'true' }}
      shell: powershell
      run: |
        $rustupInit = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
        Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $rustupInit
        & $rustupInit -y --profile minimal --default-toolchain stable
        if ($LASTEXITCODE -ne 0) {
          throw "rustup-init failed"
        }
        "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & "$env:USERPROFILE\.cargo\bin\cargo.exe" --version

    - name: Install ffmpeg for helper runtime probe
      if: ${{ inputs.install-ffmpeg == 'true' }}
      shell: powershell
      run: |
        choco install ffmpeg -y --no-progress

        $chocolateyRoot = if (-not [string]::IsNullOrWhiteSpace($env:ChocolateyInstall)) {
          $env:ChocolateyInstall
        } else {
          "C:\ProgramData\chocolatey"
        }
        $ffmpeg = Get-ChildItem -Path (Join-Path $chocolateyRoot "lib\ffmpeg") -Recurse -File -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue |
          Sort-Object -Property @{ Expression = { if ($_.FullName -match "\\tools\\.*\\bin\\ffmpeg\.exe$") { 0 } else { 1 } } }, FullName |
          Select-Object -First 1
        if (-not $ffmpeg) {
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
        }
        if (-not $ffmpeg) {
          $ffmpeg = Get-ChildItem -Path $chocolateyRoot -Recurse -File -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName |
            Select-Object -First 1
        }
        if (-not $ffmpeg) {
          throw "Unable to locate ffmpeg.exe after Chocolatey installation."
        }

        $ffmpegPath = if ($ffmpeg -is [System.Management.Automation.CommandInfo]) { $ffmpeg.Source } else { $ffmpeg.FullName }
        $ffmpegBin = Split-Path -Parent $ffmpegPath
        $ffplayPath = Join-Path $ffmpegBin "ffplay.exe"
        if (-not (Test-Path -LiteralPath $ffplayPath)) {
          throw "Unable to locate ffplay.exe next to '$ffmpegPath'."
        }

        "MUMBLE_SCREENSHARE_FFMPEG_PATH=$ffmpegPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "MUMBLE_SCREENSHARE_FFPLAY_PATH=$ffplayPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
