name: Suggestion
description: Suggest an improvement or new behavior
title: "[Suggestion] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to improve or add?
    validations:
      required: true
  - type: textarea
    id: client_environment
    attributes:
      label: Client environment
      value: |
        - Version:
        - Architecture:
        - OS:
        - Qt:
        - Connected server feedback:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional. Suggestions usually do not need logs.
      render: text
