name: Bug report
description: Report something that is broken
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: Optional, but very helpful if the bug is reproducible.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: client_environment
    attributes:
      label: Client environment
      value: |
        - Version:
        - Architecture:
        - OS:
        - Qt:
        - Connected server feedback:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant redacted logs here if you have them.
      render: text
