name: Support
description: Ask for help with Mumble
title: "[Support] "
labels: ["support", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: client_environment
    attributes:
      label: Client environment
      value: |
        - Version:
        - Architecture:
        - OS:
        - Qt:
        - Connected server feedback:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant redacted logs here if you have them.
      render: text
